const SYN={q:['frage','question','q'],a:['antwort','answer','a','richtige antwort','correct'],w1:['falsch1','wrong1','falsche antwort 1'],w2:['falsch2','wrong2','falsche antwort 2'],w3:['falsch3','wrong3','falsche antwort 3'],
  w:['falsch','wrong','falsche antworten','distraktoren'],c:['rubrik','kategorie','category','thema','topic'],g:['grad','gurt','guertel','grade','belt','kup'],d:['schwierigkeit','difficulty','level','stufe'],
  x:['erklaerung','explanation','hinweis','note'],kind:['typ','type','art','kind'],alts:['alternativen','alternatives','akzeptiert','accept'],pack:['paket','pack','set']};
const SYNMAP={};Object.keys(SYN).forEach(k=>SYN[k].forEach(s=>{SYNMAP[strip(s).replace(/[^a-z0-9 ]/g,'')]=k}));
const DEFCOLS=['q','a','w1','w2','w3','c','g','d','x','kind','alts'];
function parseCSV(text,delim){const rows=[];let row=[],cur='',inQ=false;
  for(let i=0;i<text.length;i++){const ch=text[i];
    if(inQ){if(ch==='"'){if(text[i+1]==='"'){cur+='"';i++}else inQ=false}else cur+=ch}
    else if(ch==='"'&&cur===''){inQ=true}
    else if(ch===delim){row.push(cur);cur=''}
    else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&text[i+1]==='\n')i++;row.push(cur);cur='';if(row.some(x=>x.trim()!==''))rows.push(row);row=[]}
    else cur+=ch}
  row.push(cur);if(row.some(x=>x.trim()!==''))rows.push(row);return rows}
function parseGrade(v){
  const s=strip(String(v==null?'':v)).trim();if(!s)return null;
  const nums=s.match(/^(\d+)/);
  if(typeof v==='number'||/^\d+$/.test(s)){const n=+s;for(let i=0;i<=8;i++)if(GR[i].n.indexOf(n+'. Kup')===0)return i;return undefined}
  const m=s.match(/(\d+)\D*(kup|poom|dan)/);
  if(m){const n=+m[1],k=m[2];for(let i=0;i<GR.length;i++){const g=GR[i].n;if(k==='kup'&&g===n+'. Kup')return i;if(k==='poom'&&g===n+'. Poom/Dan')return i;if(k==='dan'&&(g===n+'. Dan'||g===n+'. Poom/Dan'))return i}}
  return undefined;
}
function parseDiff(v){const s=strip(String(v==null?'':v)).trim();if(!s)return 2;if(/^[123]$/.test(s))return +s;if(/leicht|easy|einfach/.test(s))return 1;if(/schwer|hard|difficult/.test(s))return 3;if(/mittel|medium/.test(s))return 2;return 2}
function parseKind(v,hasW){const s=strip(String(v==null?'':v)).trim();if(/auswahl|mc|choice|multiple/.test(s))return 'mc';if(/frei|text|typed|tipp/.test(s))return 'text';if(/karte|card|flash/.test(s))return 'card';return hasW?'mc':'card'}
function splitList(v){if(Array.isArray(v))return v.map(x=>String(x).trim()).filter(Boolean);return String(v==null?'':v).split(/[|;]/).map(x=>x.trim()).filter(Boolean)}
function parseImport(text,pack){
  text=String(text||'').replace(/^﻿/,'').trim();
  const res={ok:[],errors:[],dups:0,fatal:''};
  if(!text){res.fatal=t('i.e.nodata');return res}
  let rows=[];
  if(text[0]==='['||text[0]==='{'){
    let j;try{j=JSON.parse(text)}catch(e){res.fatal=t('i.e.json');return res}
    const arr=Array.isArray(j)?j:Array.isArray(j.questions)?j.questions:null;if(!arr){res.fatal=t('i.e.nodata');return res}
    rows=arr.map(o=>{const r={};Object.keys(o||{}).forEach(k=>{const m=SYNMAP[strip(k).replace(/[^a-z0-9 ]/g,'')];if(m)r[m]=o[k]});return r});
  }else{
    const first=text.split(/\r?\n/)[0];const cnt=d=>first.split(d).length-1;
    const delim=cnt(';')>=cnt(',')&&cnt(';')>=cnt('\t')?';':cnt('\t')>cnt(',')?'\t':',';
    const raw=parseCSV(text,delim);if(!raw.length){res.fatal=t('i.e.nodata');return res}
    const head=raw[0].map(h=>SYNMAP[strip(h).replace(/[^a-z0-9 ]/g,'')]||null);
    let cols,data;
    if(head.indexOf('q')>=0&&head.indexOf('a')>=0){cols=head;data=raw.slice(1)}
    else if(head.filter(Boolean).length===0&&raw[0].length>=2){cols=DEFCOLS;data=raw}
    else{res.fatal=t('i.e.cols');return res}
    rows=data.map(r=>{const o={};cols.forEach((k,i)=>{if(k&&r[i]!=null&&r[i].trim()!=='')o[k]=r[i].trim()});return o});
  }
  const seen=new Set(browseList().map(q=>normTxt(q.q)));
  rows.forEach((r,i)=>{
    const rn=i+2,q=String(r.q==null?'':r.q).trim(),a=String(r.a==null?'':r.a).trim();
    if(!q){res.errors.push(t('i.row',{r:rn,m:t('i.e.q')}));return}
    if(!a){res.errors.push(t('i.row',{r:rn,m:t('i.e.a')}));return}
    let w=splitList(r.w);['w1','w2','w3'].forEach(k=>{if(r[k]!=null&&String(r[k]).trim())w.push(String(r[k]).trim())});
    w=w.filter(x=>normTxt(x)!==normTxt(a));
    const kind=parseKind(r.kind,w.length>0);
    if(kind==='mc'&&!w.length){res.errors.push(t('i.row',{r:rn,m:t('i.e.w')}));return}
    let g=parseGrade(r.g);if(g===undefined){res.errors.push(t('i.row',{r:rn,m:t('i.e.g',{v:r.g})}));return}if(g===null)g=P().target;
    const nq=normTxt(q);if(seen.has(nq)){res.dups++;return}seen.add(nq);
    res.ok.push({kind,q,a,w:kind==='mc'?w.slice(0,5):[],alts:kind==='text'?splitList(r.alts):[],x:String(r.x==null?'':r.x).trim(),c:String(r.c==null?'':r.c).trim()||t('f.defCat'),g,d:parseDiff(r.d),pack:String(r.pack==null?'':r.pack).trim()||pack});
  });
  return res;
}

 qedit(b){const c=DB.custom.find(x=>x.id===b.dataset.id);if(!c)return;ui.form={id:c.id,kind:c.kind,q:c.q,a:c.a,w1:c.w[0]||'',w2:c.w[1]||'',w3:c.w[2]||'',alts:(c.alts||[]).join(' | '),x:c.x||'',c:c.c,g:c.g,d:c.d,pack:c.pack};ui.formErr=[];ui.cat.view='form';render();window.scrollTo(0,0)},

 fkind(b){ui.form.kind=b.dataset.v;render()},

 tpl(b){ui.imp.tpl=b.dataset.v==='csv'?TPL_CSV:TPL_JSON;ui.imp.tplName=b.dataset.v==='csv'?'fragen-vorlage.csv':'fragen-vorlage.json';render()},
 tpldl(){download(ui.imp.tplName,(ui.imp.tplName.endsWith('csv')?'﻿':'')+ui.imp.tpl,ui.imp.tplName.endsWith('csv')?'text/csv':'application/json')},

 idoit(){const I=ui.imp,res=I.res;if(!res||!res.ok.length)return;res.ok.forEach(q=>{DB.custom.push(Object.assign({id:'u'+DB.nextId++},q))});const p=P();p.stats.own+=res.ok.length;const nb=checkBadges(p);wr();rebuild();toast(t('i.done',{n:res.ok.length}));nb.forEach(b=>setTimeout(()=>toast(t('toast.badge',{n:bname(b)})),1800));ui.imp={text:'',name:'',res:null,pack:'',tpl:''};ui.cat.view='list';render()},
 efmt(b){ui.exp.fmt=b.dataset.v;render()},

};
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b||b.disabled)return;const f=A[b.dataset.a];if(f){e.preventDefault();f(b)}});
document.addEventListener('input',e=>{
  const el=e.target,d=el.dataset;
  if(d.f&&ui.form){ui.form[d.f]=el.value;return}
  if(d.o==='name'&&ui.ob){ui.ob.name=el.value;return}
  if(d.i&&ui.imp){ui.imp[d.i]=el.value;return}
  if(d.o==='bk2'){ui.bkText=el.value;return}
  if(d.s){const f=ui.cat;if(d.s==='q'){f.q=el.value;f.limit=40;$('#catres').innerHTML=catResults()}}
});
document.addEventListener('change',e=>{
  const el=e.target,d=el.dataset;
  if(d.o==='target'&&ui.ob){ui.ob.target=+el.value;return}
  if(d.s==='cat'){ui.cat.cat=el.value;ui.cat.limit=40;$('#catres').innerHTML=catResults();return}
  if(d.s==='own'){ui.cat.own=el.checked;ui.cat.limit=40;$('#catres').innerHTML=catResults();return}
  if(d.f&&ui.form){ui.form[d.f]=el.value;return}
  if(d.c==='cfg'){const p=P();p.cfg[d.k]=d.k==='cat'?el.value:+el.value;wr();return}
  if(d.c==='name'){const p=P();p.name=el.value.trim()||p.name;wr();return}
  if(d.c==='target'){const p=P();p.target=+el.value;p.cfg.grade=p.target;wr();return}
  if(d.c==='exam'){P().examDate=el.value;wr();return}
  if(d.c==='file'&&el.files&&el.files[0]){const f=el.files[0];readFile(f,txt=>{ui.imp.text=txt;ui.imp.name=f.name.replace(/\.[^.]+$/,'');ui.imp.pack=ui.imp.name;ui.imp.res=parseImport(txt,ui.imp.name);render()});return}
  if(d.c==='bkfile'&&el.files&&el.files[0]){readFile(el.files[0],txt=>{ui.bkText=txt;ui.bkShow=true;render()});return}
});
document.addEventListener('keydown',e=>{
  if(ui.screen!=='quiz'||!Q)return;const q=Q.qs[Q.i];if(!q||e.target.tagName==='TEXTAREA'||e.target.tagName==='INPUT')return;
  if(!Q.answered&&q.mode==='mc'&&/^[1-5]$/.test(e.key)){const b=app.querySelectorAll('.opt')[+e.key-1];if(b)b.click()}
  else if(e.key==='Enter'&&!Q.answered&&q.mode==='mc'&&Q.sel>=0){e.preventDefault();submit(false)}
});

render();
