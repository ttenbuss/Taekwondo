<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>TKD Trainer</title>
<meta name="theme-color" content="#1b3f94">
<meta name="description" content="Taekwondo Prüfungstrainer nach DTU PO 2024 / exam trainer">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="TKD Trainer">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>

/* Layout: eine schmale Spalte mit fester Tab-Leiste unten (Daumenzone). Farben aus dem Taegeuk: Blau als Akzent, Rot nur für Fehler.
   Der Gürtel ist das zentrale Fortschrittsbild. Systemschriften, damit alles offline läuft. */
:root{
  --bg:#eef1f7; --surface:#ffffff; --ink:#13203d; --muted:#586484; --line:#d6dcea;
  --accent:#1b3f94; --accent-ink:#ffffff; --accent-bg:#e4eafa;
  --good:#1c7a4b; --good-bg:#e1f3e9; --bad:#b3261e; --bad-bg:#fbe7e5; --warn:#8a5300; --warn-bg:#fdf0d8;
  --font-display:ui-serif,'Iowan Old Style','Palatino Linotype',Georgia,'Noto Serif','Apple SD Gothic Neo','Malgun Gothic',serif;
  --font-body:system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',sans-serif;
  --r:12px; --nav:62px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d1324; --surface:#151c33; --ink:#e7ebf7; --muted:#9ba6c6; --line:#2a3454;
  --accent:#92b1ff; --accent-ink:#0d1324; --accent-bg:#1c2850;
  --good:#63d393; --good-bg:#12301f; --bad:#ff8b82; --bad-bg:#3a1714; --warn:#f0b957; --warn-bg:#342610; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1324; --surface:#151c33; --ink:#e7ebf7; --muted:#9ba6c6; --line:#2a3454;
  --accent:#92b1ff; --accent-ink:#0d1324; --accent-bg:#1c2850;
  --good:#63d393; --good-bg:#12301f; --bad:#ff8b82; --bad-bg:#3a1714; --warn:#f0b957; --warn-bg:#342610; color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{min-height:100%}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 var(--font-body);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px calc(var(--nav) + 28px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:600px;margin-inline:auto;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--font-display);margin:0;line-height:1.25;text-wrap:balance}
h1{font-size:1.4rem;font-weight:800}h2{font-size:1.15rem;font-weight:700}h3{font-size:1rem;font-weight:700}
p{margin:0}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.stack{display:flex;flex-direction:column;gap:12px;min-width:0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;min-width:0}
.row.sp{justify-content:space-between}
.grow{flex:1;min-width:0}
.label{font-size:.72rem;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted);font-size:.9rem}
.btn{border:0;background:var(--accent);color:var(--accent-ink);padding:12px 20px;border-radius:10px;font-weight:600;min-height:44px}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.sm{padding:6px 12px;min-height:36px;font-size:.88rem}
.btn.danger{background:var(--bad);color:#fff}
.btn.block{width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed}
/* Navigation */
.nav{position:fixed;inset:auto 0 0 0;background:var(--surface);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px));z-index:5}
.nav button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;height:var(--nav);color:var(--muted);font-size:.72rem;font-weight:600}
.nav button svg{width:24px;height:24px}
.nav button[aria-current="page"]{color:var(--accent)}
/* Rang-Gürtel */
.beltbar{height:22px;border-radius:5px;border:1px solid rgba(0,0,0,.35);position:relative;overflow:hidden}
.beltbar i{position:absolute;inset:0 auto 0 50%;width:18px;margin-left:-9px}
.prog{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.prog>div{height:100%;background:var(--accent);transition:width .4s}
.rankname{font-family:var(--font-display);font-weight:800;font-size:1.5rem}
.ring{position:relative;width:84px;height:84px;flex:none}
.ring svg{width:84px;height:84px;transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--font-display);font-size:1.1rem}
.chip{display:inline-block;font-weight:700;font-size:.75rem;letter-spacing:.04em;text-transform:uppercase;padding:2px 9px;border-radius:99px;border:1px solid currentColor}
.avatar{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-family:var(--font-display);font-weight:800;color:#fff;flex:none}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{display:flex;flex-direction:column;gap:3px;text-align:left;padding:14px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);min-width:0}
.tile b{font-weight:700}
.tile span{font-size:.82rem;color:var(--muted)}
.tile.main{grid-column:1/-1;background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tile.main span{color:inherit;opacity:.85}
/* Formulare */
label.f{display:flex;flex-direction:column;gap:4px;font-size:.88rem;font-weight:600}
input[type=text],input[type=date],input[type=search],textarea,select{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:9px;background:var(--bg);font-weight:400}
textarea{min-height:84px;resize:vertical}
.seg{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:8px}
.seg button{padding:10px 12px;border:1px solid var(--line);background:var(--surface);border-radius:9px;text-align:left;display:flex;flex-direction:column;gap:2px}
.seg button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-bg);box-shadow:inset 0 0 0 1px var(--accent)}
.seg small{color:var(--muted);font-size:.76rem;line-height:1.3}
.belts{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px}
.belt{display:flex;align-items:center;gap:8px;padding:9px;background:var(--surface);border:1px solid var(--line);border-radius:8px;text-align:left;min-width:0;font-weight:600;font-size:.9rem}
.belt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-bg);box-shadow:inset 0 0 0 1px var(--accent)}
.sw{flex:none;width:28px;height:12px;border-radius:2px;border:1px solid rgba(0,0,0,.35);position:relative;overflow:hidden}
.sw i{position:absolute;inset:0 auto 0 50%;width:7px;margin-left:-3.5px}
details{border:1px solid var(--line);border-radius:9px;padding:9px 12px;background:var(--surface)}
summary{cursor:pointer;font-weight:600}
dl.progdl{margin:10px 0 0;display:grid;grid-template-columns:minmax(0,8rem) minmax(0,1fr);gap:6px 12px;font-size:.88rem}
dl.progdl dt{color:var(--muted);font-weight:600}dl.progdl dd{margin:0}
@media (max-width:480px){dl.progdl{grid-template-columns:1fr;gap:1px}dl.progdl dd{margin-bottom:7px}}
/* Quiz */
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar>div{height:100%;background:var(--accent);transition:width .25s}
.qhead{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:.82rem;color:var(--muted)}
.q{font-family:var(--font-display);font-size:1.25rem;font-weight:600;line-height:1.4;text-wrap:pretty}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;padding:12px 14px;border:1px solid var(--line);background:var(--surface);border-radius:9px;min-width:0}
.opt .k{flex:none;width:24px;height:24px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-size:.78rem;font-weight:700;color:var(--muted)}
.opt[aria-checked="true"]{border-color:var(--accent);background:var(--accent-bg)}
.opt[aria-checked="true"] .k{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.opt.ok{border-color:var(--good);background:var(--good-bg)}.opt.no{border-color:var(--bad);background:var(--bad-bg)}
.opt[disabled]{cursor:default}
.fb{border-radius:9px;padding:13px 15px;display:flex;flex-direction:column;gap:8px;border:1px solid}
.fb.good{background:var(--good-bg);border-color:var(--good);color:var(--ink)}.fb.mid{background:var(--warn-bg);border-color:var(--warn)}.fb.bad{background:var(--bad-bg);border-color:var(--bad)}
.fb.good .chip{color:var(--good)}.fb.mid .chip{color:var(--warn)}.fb.bad .chip{color:var(--bad)}
.ans{font-weight:600}
.big{font-family:var(--font-display);font-size:2.2rem;font-weight:800;line-height:1.1}
.verdict.good{color:var(--good);font-weight:700}.verdict.bad{color:var(--bad);font-weight:700}
.cat{display:grid;grid-template-columns:minmax(0,9rem) 1fr 3rem;gap:10px;align-items:center;font-size:.88rem}
.cat span:last-child{text-align:right;font-variant-numeric:tabular-nums}
.rev article{border-top:1px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:3px;font-size:.92rem}
.rev .mine{color:var(--bad)}
/* Listen */
.qitem{border-top:1px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:6px}
.qitem:first-child{border-top:0;padding-top:0}
.qitem .t{font-weight:600;overflow-wrap:anywhere}
.qitem .a{font-size:.9rem;color:var(--muted);overflow-wrap:anywhere}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(86px,1fr));gap:10px}
.badge{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;font-size:.74rem;line-height:1.25}
.badge .coin{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-family:var(--font-display);font-weight:800;font-size:1.05rem;background:var(--accent);color:var(--accent-ink);border:3px solid var(--accent-bg)}
.badge.off{opacity:.45}.badge.off .coin{background:var(--line);color:var(--muted);border-color:transparent}
.toast{position:fixed;left:16px;right:16px;bottom:calc(var(--nav) + 14px + env(safe-area-inset-bottom,0px));max-width:560px;margin-inline:auto;background:var(--ink);color:var(--bg);padding:11px 14px;border-radius:10px;font-weight:600;z-index:9;text-align:center}
.banner{background:var(--warn-bg);border:1px solid var(--warn);border-radius:9px;padding:10px 12px;font-size:.88rem}
.pop{animation:pop .5s ease-out}
@keyframes pop{0%{transform:scale(.92);opacity:.4}60%{transform:scale(1.03)}100%{transform:scale(1);opacity:1}}
.sw-toggle{width:46px;height:26px;border-radius:13px;border:1px solid var(--line);background:var(--line);position:relative;padding:0;flex:none}
.sw-toggle::after{content:'';position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .15s}
.sw-toggle[aria-checked="true"]{background:var(--accent);border-color:var(--accent)}
.sw-toggle[aria-checked="true"]::after{left:22px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* Ergänzungen */
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.top h1{font-size:1.15rem}
.langs{display:flex;border:1px solid var(--line);border-radius:99px;overflow:hidden}
.langs button{border:0;background:none;padding:4px 11px;font-size:.78rem;font-weight:700;color:var(--muted)}
.langs button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.who{display:flex;align-items:center;gap:12px;min-width:0}
.who b{display:block;font-family:var(--font-display);font-size:1.1rem;overflow-wrap:anywhere}
.stat{display:inline-flex;align-items:center;gap:5px;font-weight:700;font-variant-numeric:tabular-nums}
.stat svg{width:18px;height:18px}
.stat.flame{color:var(--flame)}.stat.xp{color:var(--accent)}
.beltbar.big{height:30px}
.beltbar b{position:absolute;inset:-4px auto -4px 50%;width:20px;margin-left:-10px;background:rgba(0,0,0,.2);border-radius:3px}
.tile{cursor:pointer}
.tile.main b{font-size:1.1rem}
.tile .n{font-variant-numeric:tabular-nums}
.mcard{padding:0;overflow:hidden}
.mhead{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;background:none;padding:14px 16px}
.mhead b{display:block}
.mhead .chev{font-size:1.4rem;color:var(--muted);transition:transform .15s}
.mhead[aria-expanded="true"] .chev{transform:rotate(90deg)}
.mbody{padding:0 16px 16px;display:flex;flex-direction:column;gap:12px}
.fld{display:flex;flex-direction:column;gap:6px}
.pill{display:inline-block;font-size:.74rem;font-weight:700;padding:1px 8px;border-radius:99px;background:var(--accent-bg);color:var(--accent);font-variant-numeric:tabular-nums}
.act{display:flex;gap:4px;align-items:flex-end;height:84px}
.act .d{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:3px;font-size:.62rem;color:var(--muted);height:100%}
.act i{display:block;width:100%;background:var(--accent);border-radius:3px 3px 0 0;min-height:3px}
.act i.g{background:var(--good)}
.errs{display:flex;flex-direction:column;gap:4px;color:var(--bad);font-size:.9rem}
.ov{position:fixed;inset:0;background:rgba(10,15,30,.55);display:grid;place-items:center;padding:16px;z-index:20}
.dlg{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;max-width:380px;width:100%;display:flex;flex-direction:column;gap:14px}
.sel{appearance:auto}
.xpline{display:flex;flex-wrap:wrap;gap:6px}
.copybox{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.78rem;min-height:140px}
.dim{opacity:.55}
.avs{display:flex;flex-wrap:wrap;gap:8px}
.avs button{border:2px solid transparent;border-radius:50%;padding:0;background:none}
.avs button[aria-pressed="true"]{border-color:var(--accent)}
.card.hero{gap:14px}
.sub{font-size:.82rem;color:var(--muted)}
:root{--flame:#c2410c}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--flame:#ffb066}}
:root[data-theme="dark"]{--flame:#ffb066}

:root{padding-top:env(safe-area-inset-top,0px)}
</style>
</head>

h(9,2,PO,'Nach welcher Frist kann eine nicht bestandene Dan-Prüfung frühestens wiederholt werden?','Nach 3 Monaten',['Nach 3 Wochen','Nach 6 Monaten','Nach 1 Jahr'],'Kup-Prüfungen nach 3 Wochen, Dan-Prüfungen nach 3 Monaten.',{re:[/\b3\b|drei/]});
h(0,3,PO,'Welche Einspruchsmöglichkeit besteht gegen ein Prüfungsergebnis?','Nur gegen formelles Fehlverhalten des Prüfers oder Verfahrensmängel; schriftlich mit Begründung binnen 2 Wochen beim BPR',['Gegen jede Leistungsbewertung binnen 4 Wochen beim Landesverband','Gar kein Einspruch','Gegen jede Bewertung, mit Filmaufnahmen als Beweis'],'Die Leistungsbewertung selbst ist endgültig. Filmaufnahmen sind nicht als Beweismittel zugelassen. BPR = Bundesreferent für das Prüfungswesen.',{kw:[[/formell|verfahren|mangel|fehlverhalten/],[/2 wochen|zwei wochen|14 tage/],[/bpr|bundesreferent/]],need:2});
h(0,2,PO,'Wie wird bei Kup-Prüfungen die Theorie geprüft?','Mündlich',['Schriftlich per Fragebogen','Praktisch als Demonstration','Gar nicht'],'Bei Poom- und Dan-Anwärtern entfällt die Theorieprüfung.',{re:[/muendlich|mundlich|mund/]});
h(9,2,PO,'Wird bei Poom- und Dan-Prüfungen eine Theorieprüfung abgelegt?','Nein, sie entfällt',['Ja, schriftlich','Ja, mündlich','Nur zum 3. Dan'],'PO Zweiter Teil § 2 Nr. 5 d.',{re:[/nein|entfall|keine/]});
h(0,3,PO,'Unter welcher Bedingung ist ein Überspringen eines Kup-Grades möglich?','Nur vom 9. direkt zum 8. Kup in derselben Prüfung, bei überdurchschnittlichen Leistungen und eingehaltenen Vorbereitungszeiten',['Von jedem Kup auf den übernächsten bei sehr guter Leistung','Nur vom 2. direkt zum 1. Kup','Gar nicht'],'PO Zweiter Teil § 2 Nr. 12: Ein weiteres Überspringen ist nicht möglich.',{kw:[[/9/],[/8/]],need:2});
h(0,3,PO,'Ein Anwärter verletzt sich und kann die Prüfung nicht fortsetzen. Wann gilt sie als bestanden?','Wenn bis zum Abbruch mehr als die Hälfte der vorgesehenen Prüfungsfächer mit „Ja“ bewertet wurde',['Immer, wenn er sich selbst verletzt hat','Nie, sie muss wiederholt werden','Wenn mindestens ein Fach „Ja“ erhielt'],'PO Zweiter Teil § 2 Nr. 9 a. Verletzt ein Anwärter einen anderen allein schuldhaft, wird seine Prüfung als nicht bestanden gewertet.',{re:[/mehr als die (haelfte|halfte)|ueber die halfte|uber die halfte/]});
h(0,2,PO,'Wer entscheidet über die Reihenfolge der Prüfungsdisziplinen?','Der Prüfer',['Der Anwärter','Der Verein','Der Landesverband'],'PO Zweiter Teil § 1 Nr. 7.',{re:[/pruefer|prufer/]});
h(0,2,PO,'Wie viele Prüfer nehmen eine Kup-Prüfung ab und welche Lizenz müssen sie mindestens haben?','Ein Prüfer allein, mindestens Prüferlizenz Stufe C',['Zwei Prüfer, Stufe B','Drei Prüfer, Stufe A','Ein Prüfer, Stufe A'],'PO Zweiter Teil § 1 Nr. 5 a.',{kw:[[/allein|ein prufer|ein pruefer|\b1\b|einer|einzel/],[/\bc\b|stufe c/]],need:2});
h(9,2,PO,'Wie setzt sich die Prüfungskommission bei Dan-Prüfungen grundsätzlich zusammen?','Drei lizenzierte Prüfer (Lizenzstufen B und A) mit einem Vorsitzenden',['Ein Prüfer mit Lizenz C','Zwei Prüfer','Fünf Prüfer'],'PO Zweiter Teil § 1 Nr. 6. Bei Vereins- und Landes-Dan zum 1. Dan/Poom reicht ein Prüfer mit Stufe B, zum 2. und 3. Dan/Poom ein Prüfer mit Stufe A.',{re:[/\b3\b|drei/]});
h(0,3,PO,'Wer setzt die Höhe der Prüfungsgebühr bei Kup-Prüfungen fest, und darf der Prüfer sie einziehen?','Der Verein setzt sie fest; der Prüfer darf sie weder bestimmen noch einziehen',['Der Prüfer setzt sie fest und zieht sie ein','Der DTU-Bundesreferent setzt sie fest','Der Landesverband setzt sie fest, der Prüfer zieht sie ein'],'PO Dritter Teil § 2 Nr. 5 b. Bei Nichtbestehen oder Nichtteilnahme besteht kein Erstattungsanspruch.',{re:[/verein/]});
h(0,3,PO,'Innerhalb welcher Frist trägt der Prüfer die Kup-Prüfungsergebnisse in die DTU-Datenbank ein?','Innerhalb von 7 Tagen',['Innerhalb von 24 Stunden','Innerhalb von 4 Wochen','Innerhalb von 3 Monaten'],'PO Zweiter Teil § 1 Nr. 5 e.',{re:[/\b7\b|sieben/]});
h(0,3,PO,'Sind Prüfungen grundsätzlich öffentlich?','Ja, sofern eine störungsfreie Durchführung gewährleistet ist',['Nein, nur für Vereinsmitglieder','Nur Dan-Prüfungen','Nur wenn der Prüfer es erlaubt'],'PO Dritter Teil § 1 Nr. 5.',{re:[/\bja\b|oeffentlich|offentlich/]});
h(9,3,PO,'Wie viele Bonuspunkte benötigen Poom- und Dan-Anwärter, damit eine „Nein“-Bewertung neutralisiert werden kann?','Poom 1,0 Punkte, Dan 2,0 Punkte; nur eine Nein-Bewertung pro Prüfung',['Poom 2,0, Dan 1,0; beliebig viele Nein-Bewertungen','Poom 0,5, Dan 1,0; zwei Nein-Bewertungen','Immer 3,0 Punkte'],'PO Zweiter Teil § 2 Nr. 8. Es können höchstens fünf Lehrgänge berücksichtigt werden.',{kw:[[/1[,.]0|\b1\b/],[/2[,.]0|\b2\b/]],need:2});
h(0,3,PO,'Welche Prüfungsveranstaltungen sind in der DTU möglich?','Kup (10.–1.), Vereins-Dan (1.–3.), Landes-Dan (1.–9.), Bundes-Dan (4.–9.)',['Kup (10.–1.), Landes-Dan (1.–3.), Bundes-Dan (4.–9.)','Nur Kup und Landes-Dan','Kup (9.–1.), Vereins-Dan (1.–9.), Bundes-Dan (1.–9.)'],'PO Dritter Teil § 1 Nr. 3.');
h(0,3,PO,'Wird das Dan-Zertifikat eines Poomgrades erst nach einer neuen technischen Prüfung ausgestellt?','Nein, der Poomgrad kann nach Erreichen des Mindestalters ohne technische Prüfung umgeschrieben werden; das Datum der Poomprüfung zählt',['Ja, immer','Nur ab dem 2. Poom','Nur auf Antrag des Vereins mit Prüfung'],'PO Dritter Teil § 2 Nr. 8.',{re:[/nein|ohne/]});
h(12,2,PO,'Welche Zulassungsvoraussetzung besteht für die Prüfung zum 6. und 7. Dan?','Gültige DOSB-Trainer-Lizenz C „Taekwondo“',['Gültige Trainer-Lizenz B','Bundes-Kampfrichter-Lizenz','Keine'],'Zum 8. Dan und höher: DOSB-Trainer-Lizenz B oder Bundes-Kampfrichter-Lizenz der DTU.',{re:[/\bc\b|trainer.?lizenz c|lizenz c/]});
h(12,2,PO,'Welche Zulassungsvoraussetzung besteht für die Prüfung zum 8. und 9. Dan?','DOSB-Trainer-Lizenz B „Taekwondo“ oder Bundes-Kampfrichter-Lizenz der DTU',['DOSB-Trainer-Lizenz C','Eine Prüferlizenz Stufe A','WT-Kampfrichterlizenz'],'PO Erster Teil § 1 Nr. 7 c.',{kw:[[/\bb\b/],[/kampfrichter/]],need:1});
h(12,3,PO,'Welche Anforderungen gelten für die Partner, die ein Dan-Anwärter für Prüfungsteile mitbringt?','Die Partner sollen mindestens den 2. Kup besitzen; der Anwärter verantwortet Vorbereitung und Präsentation',['Mindestens den 1. Dan','Mindestens den 5. Kup','Es gibt keine Anforderungen'],'PO Zweiter Teil § 2 Nr. 2 d.',{re:[/2\.?\s*kup/]});
h(12,3,PO,'Worauf liegen bei den Vorführprogrammen der Lehrergrade die Bewertungsschwerpunkte?','Schwierigkeitsgrad, Ideenreichtum, Darstellungsform und Darbietung',['Nur auf der Kraftentwicklung','Auf den Wettkampferfolgen des Anwärters','Auf der Länge der Vorführung'],'PO Zweiter Teil § 2 Nr. 2 d.',{kw:[[/schwierig/],[/ideen/],[/darstellung|darbietung|praesent/]],need:2});
/* --- Zweikampf & Technik --- */
h(2,2,ZK,'Ab welcher Graduierung können wahlweise Hyong- oder Poomsae-Formen gelaufen werden, und was gilt bei Dan-Prüfungen?','Ab 7. Kup wahlweise Hyong oder Poomsae; bei Dan-Prüfungen nur Poomsae',['Ab 9. Kup wahlweise; Dan nur Hyong','Ab 4. Kup wahlweise; Dan beides','Nur Poomsae in allen Prüfungen'],'PO Erster Teil § 3 Nr. 3 B.',{kw:[[/7/],[/dan.*(nur )?poomsae|poomsae.*dan/]],need:1});
h(2,2,PS,'Wie beginnt jede Form in der Prüfung?','Mit Blickrichtung zum Prüfertisch; der Anwärter sagt zuvor den Namen der Form an; der Ablauf erfolgt ohne Einzelkommandos',['Mit dem Rücken zum Prüfer; der Prüfer gibt Einzelkommandos','Seitlich zum Prüfertisch; der Prüfer sagt die Form an','Mit Blick zur Flagge ohne Ansage'],'PO Erster Teil § 3 Nr. 3 B.',{kw:[[/pruefertisch|prufertisch|pruefer|prufer/],[/ansag|nennt|sagt/],[/ohne|kommando/]],need:2});
h(2,3,PS,'Welche Anforderungskriterien gelten laut PO für die Poomsae-Formenschule?','Korrekter Technik- und Bewegungsablauf, Einhaltung des Diagramms, Ablaufrhythmus, Kampfschrei an vorgegebener Stelle',['Nur die Geschwindigkeit des Laufs','Ausdruck, Musikalität und Kreativität','Nur die Anzahl der Bewegungen'],'PO Erster Teil § 3 Nr. 3 B: dazu kommen die allgemeingültigen Anforderungskriterien für TKD-Techniken.',{kw:[[/ablauf|bewegung/],[/diagramm/],[/rhythm/],[/kampfschrei|kihap/]],need:3});
h(1,2,ZK,'Wie beginnt jede Übung im 1-Schritt-Kampf (Technik)?','Der Angreifer geht einen Schritt zurück und gibt gleichzeitig einen Kampfschrei ab; der Angriff erfolgt, nachdem der Verteidiger ebenfalls per Kampfschrei Bereitschaft angezeigt hat',['Der Verteidiger geht zurück, der Angreifer greift sofort an','Beide verbeugen sich und greifen gleichzeitig an','Der Prüfer gibt das Kommando „Sijak“ für jede Übung'],'PO Erster Teil § 3 Nr. 3 C c. Die Übungen werden seitlich zum Prüfertisch durchgeführt.',{kw:[[/schritt zurueck|schritt zuruck|zurueck|zuruck/],[/kampfschrei|kihap/],[/verteidiger/]],need:2});
h(1,2,ZK,'Welche Stellung nimmt der Angreifer beim formenorientierten 1-Schritt-Kampf für einen Fauststoß ein, und welche vor einem Fußangriff?','Faust: große Vorwärtsbeugestellung (Ap Kubi); Fuß: Rückwärtsbeugestellung (Dwit Kubi)',['Faust: Dwit Kubi; Fuß: Ap Kubi','Faust: Juchum Seogi; Fuß: Moa Seogi','Beide: Naranhi Seogi'],'PO Erster Teil § 3 Nr. 3 C c (die PO schreibt „ab gubi“ und „dwit gubi“).',{kw:[[/ap.?(k|g)ubi|ab.?gubi|vorw/],[/dwit|dwi.?(k|g)ubi|ruckw|rueckw/]],need:2});
h(2,3,ZK,'Wie viele Angriffstechniken darf der Verteidiger im 1-Schritt-Kampf als Konter höchstens zeigen, und wie zählen Doppeltechniken?','Höchstens drei; Doppeltechniken zählen als eine Technik',['Höchstens fünf; Doppeltechniken zählen doppelt','Höchstens zwei; Doppeltechniken zählen als eine','Beliebig viele'],'PO Erster Teil § 3 Nr. 3 C c und 4 E d. Halten, Greifen, Werfen und SV-Techniken sind im 1-Schritt-Kampf nicht zulässig.',{kw:[[/\b3\b|drei/],[/doppel.*(1|ein)|(1|ein).*doppel/]],need:2});
h(2,3,ZK,'Wohin richtet der Angreifer beim formenorientierten 1-Schritt-Kampf seine Fauststöße und Fußangriffe?','Faust zur Körpermitte (Solar Plexus) oder zum Kopf (Nase); Fußangriffe mindestens zur Körpermitte',['Nur zum Kopf','Faust zur Körpermitte, Fuß zum Knie','Immer zum Bein'],'PO Erster Teil § 3 Nr. 3 C c.',{kw:[[/solar|koerpermitte|korpermitte|magen/],[/nase|kopf|gesicht/]],need:1});
h(3,2,ZK,'Was unterscheidet den 2-Schritt-Kampf vom 1-Schritt-Kampf?','Der Angreifer geht zwei Schritte nach vorne und greift bei jedem Schritt an; der Verteidiger kontert erst nach dem letzten Angriff',['Der Verteidiger greift zuerst an','Es gibt zwei Verteidiger','Der Angriff erfolgt nur mit Fußtechniken'],'PO Erster Teil § 3 Nr. 3 D; beim 3-Schritt-Kampf geht der Angreifer drei Schritte vor.',{kw:[[/zwei|2/],[/jeden schritt|bei jedem|je schritt/],[/nach dem letzten|letzten angriff|erst nach/]],need:2});
h(5,3,PS,'Wie läuft eine Poomsae-Applikation praktisch ab?','In drei Varianten: allein nach WOP-Regeln, mit Partnern in gemäßigtem Tempo, mit Partnern in realitätsnaher Geschwindigkeit bei leichtem Kontakt',['Nur einmal mit Partnern in vollem Tempo','Zweimal allein, einmal mit Partner','Nur als Erklärung ohne Partner'],'PO Erster Teil § 3 Nr. 3 F b. Die Partner müssen Schutzausrüstung tragen, dem Anwärter ist sie freigestellt.',{kw:[[/allein|wop/],[/gemaessigt|gemass|langsam/],[/realit|leichtem kontakt|schnell/]],need:2});
h(5,2,PS,'Woraus wählt der Anwärter die Sequenzen für die Poomsae-Applikation aus?','Aus den Poomsae-Formen der bisherigen Prüfungsprogramme',['Aus beliebigen Hyong-Formen','Aus den Taegeuk-Formen, die der Prüfer vorgibt','Aus einer freien Choreografie'],'PO Erster Teil § 3 Nr. 3 F d.',{re:[/bisherig|vorprogramm|poomsae/]});
h(0,2,ZK,'Worum geht es beim Pratzensparring?','Von Angriffstechniken gegen ruhende Ziele bis zu Kombinationen auf 2 Pratzen, bei denen der Pratzenhalter Distanz und Tempo variiert',['Um Kämpfe mit vollem Körperkontakt','Um das Brechen von Brettern','Um die Abwehr von Stockangriffen'],'PO Erster Teil § 3 Nr. 4 B. Kriterien: Variabilität, Schnelligkeit, Distanzeinschätzung, Treffsicherheit, Krafteinwirkung.',{kw:[[/pratze/],[/kombination|mehrfach|variab|distanz|tempo/]],need:1});
h(0,2,ZK,'Worauf kommt es beim Step-Sparring an?','Auf flexible Bewegung in Kampfhaltung, Distanzwahrung und Schrittvielfalt',['Auf harte Treffer','Auf das Brechen von Brettern','Auf feste Formen'],'PO Erster Teil § 3 Nr. 4 A. Das Spektrum reicht von Bewegungen „auf der Linie“ bis zur freien Bewegung im Raum.',{kw:[[/distanz|abstand/],[/bewegung|schritt|flexib/]],need:1});
h(5,2,ZK,'Was gehört beim Situations-Sparring zwingend zur Ausrüstung und zum Kontakt?','Persönliche vollständige Schutzausrüstung; leichter Körperkontakt ohne Kopftreffer',['Keine Schutzausrüstung; voller Kontakt','Nur Mundschutz; leichter Kontakt mit Kopftreffern','Brustschutz allein; harter Kontakt'],'PO Erster Teil § 3 Nr. 4 C a.',{kw:[[/schutz/],[/leicht/]],need:2});
h(5,3,ZK,'Nenne zwei Beispiele für Sequenzen im Situations-Sparring.','z. B. Angriff–Konter (1-1), Angriff–2 Konter (1-2), 2 Angriffe–Konter (2-1), 2 Angriffe–2 Konter (2-2), Angriff–Konter–Gegenkonter (1-1-1)',['Nur 1-1 und 3-3','Angriff–Block–Pause','Konter vor Angriff'],'PO Erster Teil § 3 Nr. 4 C b.',{re:[/1.?1|1.?2|2.?1|2.?2|konter/]});
h(5,2,ZK,'Was unterscheidet das Sparring mit Aufgabenstellung vom Situations-Sparring?','Dem Anwärter werden technische, strategische oder taktische Aufgaben vorgegeben, die er selbstständig umsetzt',['Es wird ohne Schutzausrüstung geführt','Es hat keine Regeln','Es besteht nur aus Pratzenarbeit'],'PO Erster Teil § 3 Nr. 4 D.',{re:[/aufgabe|vorgab|taktisch|strateg/]});
h(1,2,ZK,'Was unterscheidet das Freie Sparring vom Sparring mit Aufgabenstellung?','Beim Freien Sparring gibt es keine inhaltlichen Vorgaben; die Kontrahenten gestalten den Kampf selbst',['Es wird ohne Kampfleiter geführt','Es wird mit vollem Kontakt und Kopftreffern geführt','Es dauert immer drei Runden'],'PO Erster Teil § 3 Nr. 4 F. Es geht nicht um einen Titel, sondern ob der Anwärter die Anforderungen bewältigt.',{re:[/keine.*(vorgab|inhalt)|selbst|frei/]});
h(1,3,ZK,'Wie beginnt das Freie Sparring in der Prüfung?','Beide stehen seitlich zum Prüfertisch, setzen einen Fuß zurück, nehmen Kampfstellung ein und geben einen Kampfschrei ab; der Kampf beginnt auf Freigabe des Kampfleiters',['Auf das Kommando „Sijak“ des Anwärters','Nach einer Verbeugung zum Prüfer ohne Kampfschrei','Mit einem Schritt vor und Verbeugung'],'PO Erster Teil § 3 Nr. 4 F d.',{kw:[[/seitlich/],[/kampfschrei|kihap/],[/kampfleiter|freigabe/]],need:2});
/* --- Bruchtest --- */
h(5,1,BR,'Aus welchem Material bestehen Bruchtest-Bretter laut PO und wie groß sind sie?','Fichtenholzbretter, ca. 30 × 30 cm',['Buchenholz, 20 × 20 cm','Kiefer, 40 × 40 cm','Ziegel oder Fichtenbretter nach Wahl'],'PO Erster Teil § 3 Nr. 5 b.',{kw:[[/fichte/],[/30/]],need:1});
h(5,2,BR,'Welche Brettstärke gilt für Männer von 18 bis 39 Jahren?','2,5 cm',['1,5 cm','2,0 cm','3,0 cm'],'Frauen 18–39: 2,0 cm; Jugendliche 15–17 sowie Frauen und Männer ab 40: 1,5 cm. Bei 2,5 und 2,0 cm wird eine Toleranz von 0,2 cm akzeptiert.',{re:[/2[,.]5/]});
h(5,2,BR,'Welche Brettstärke gilt für Frauen von 18 bis 39 Jahren?','2,0 cm',['1,5 cm','2,5 cm','3,0 cm'],'Männer 18–39: 2,5 cm. Toleranz: 0,2 cm.',{re:[/2[,.]0|\b2\b\s*cm|zwei/]});
h(5,2,BR,'Welche Brettstärke gilt für Jugendliche von 15 bis 17 sowie für Erwachsene ab 40 Jahren?','1,5 cm',['2,0 cm','2,5 cm','1,0 cm'],'PO Erster Teil § 3 Nr. 5 b.',{re:[/1[,.]5/]});
h(5,1,BR,'Dürfen Kinder und Jugendliche unter 15 Jahren Bruchtests machen?','Nein, sie wählen stattdessen eine Option aus einem der Wahlbereiche',['Ja, mit 1,5 cm Brettern','Ja, aber nur mit Fußtechniken','Nur mit Zustimmung der Eltern'],'PO Erster Teil § 3 Nr. 5 a.',{re:[/nein|keine/]});
h(5,3,BR,'Was darf ein Anwärter über 40 Jahren anstelle einer vorgeschriebenen Sprungtechnik wählen?','Einen Bruchtest ohne Sprung',['Gar nichts, die Sprungtechnik ist Pflicht','Einen Bruchtest mit zwei Brettern','Eine Poomsae'],'PO Erster Teil § 3 Nr. 5 a.',{re:[/ohne sprung|kein.*sprung/]});
h(5,3,BR,'Was ist eine Bruchtest-Kombination laut PO?','Mindestens 2 Bruchtests, zwischen denen höchstens zwei Schritte liegen und keine Konzentrationsphase oder Verzögerung erkennbar ist',['Zwei Bretter, die gleichzeitig gebrochen werden','Mindestens 3 Bruchtests mit freier Pause','Ein Bruchtest mit Hand und Fuß nacheinander'],'PO Erster Teil § 3 Nr. 5 f. Die Kombination wird als eine Einheit bewertet.',{kw:[[/2|zwei/],[/schritt/],[/konzentration|verzoeger|verzoger|fluss/]],need:2});
h(9,3,BR,'In welcher Höhe erfolgt ein Sprungbruchtest nach oben in der Regel mindestens?','Mindestens Kopfhöhe (Gesichtsmitte) des Anwärters',['Brusthöhe','Hüfthöhe','Scheitelhöhe plus 20 cm'],'PO Erster Teil § 3 Nr. 5 g.',{re:[/kopf|gesicht/]});
h(5,2,BR,'Wer ist für den Aufbau des Bruchtests und die Einweisung der Bretthalter verantwortlich?','Der Anwärter (bei Kup-Graden und Jugendlichen sind Hilfestellungen möglich)',['Der Prüfer','Der Verein','Der Landesverband'],'Vor der Durchführung sagt der Anwärter die Technik an. PO Erster Teil § 3 Nr. 5 e.',{re:[/anwaerter|anwarter|pruefling|prufling/]});
h(5,2,BR,'Was gilt, wenn der Bruchtest beim ersten Mal nicht gelingt?','Der Anwärter kann einen weiteren Versuch unternehmen (auch mit anderer Technik); der bessere Versuch wird gewertet',['Die Prüfung ist beendet','Es ist kein zweiter Versuch erlaubt','Der Prüfer wählt eine leichtere Technik'],'PO Zweiter Teil § 2 Nr. 5 b.',{re:[/weiter|zweit|erneut|besser/]});
h(12,3,BR,'Wie viele Bruchtests sind bei Lehrergraden höchstens zulässig, und wie müssen mehrere ausgeführt werden?','Bis zu 4; mehrere müssen als Kombination ausgeführt werden',['Bis zu 2; einzeln','Bis zu 6; beliebig','Genau 3 als Kombination'],'PO Erster Teil § 3 Nr. 5 h.',{kw:[[/4|vier/],[/kombination/]],need:2});
h(9,3,BR,'Auf welche Brettstärke darf bei Dan-Prüfungen mit hohem Schwierigkeitsgrad reduziert werden?','Männer bis auf 2 cm, Frauen bis auf 1,5 cm',['Männer 1,5 cm, Frauen 1,0 cm','Männer 2,5 cm, Frauen 2,0 cm','Gar nicht reduzierbar'],'PO Erster Teil § 3 Nr. 5 b.',{kw:[[/2/],[/1[,.]5/]],need:2});
/* --- Selbstverteidigung --- */
h(2,2,SV,'Wie ist die „Lange Distanz“ in der SV laut PO definiert?','Der Angreifer kann den Verteidiger nur mit Fußtritten erreichen',['Der Angreifer erreicht den Verteidiger mit Faustschlägen','Abstand von 30 cm bis Körperkontakt','Der Angreifer liegt am Boden'],'PO Erster Teil § 3 Nr. 6 e.',{re:[/fusstritt|fustritt|tritt|fuss/]});
h(2,2,SV,'Wie ist die „Mittlere Distanz“ definiert?','Der Angreifer kann den Verteidiger mit Faustschlägen erreichen',['Nur mit Fußtritten','30 cm bis Körperkontakt','Bodenlage'],'PO Erster Teil § 3 Nr. 6 e.',{re:[/faust|schlag|hand/]});
h(2,3,SV,'Wie ist die „Nahe Distanz“ definiert?','Von 30 cm Abstand bis Körperkontakt',['Alles unter 1 Meter','Nur Körperkontakt','Ab 1 Meter bis 2 Meter'],'PO Erster Teil § 3 Nr. 6 e. Daneben gibt es die Boden-Grundsituationen.',{re:[/30/]});
h(1,2,SV,'Welche Bedeutung hat die Fallschule in der PO?','Sie dient der Verletzungsprävention und kann auf Verlangen des Prüfers in vollem Umfang abgeprüft werden',['Sie ist nur für Dan-Prüfungen relevant','Sie ist Teil des Bruchtests','Sie wird nur bei Kindern geprüft'],'PO Erster Teil § 3 Nr. 6 d.',{re:[/verletz|praevention|pravention|schutz/]});
h(3,2,SV,'Unter welchem rechtlichen Aspekt stehen die SV-Übungen laut PO?','Notwehrrecht und Verhältnismäßigkeit der Mittel; Eigensicherung hat besondere Bedeutung',['Nur unter dem Aspekt des Wettkampfrechts','Unter dem Strafrecht ohne Einschränkung','Unter dem Hausrecht des Dojang'],'PO Erster Teil § 3 Nr. 6 b.',{re:[/notwehr|verhaeltnis|verhaltnis/]});
h(5,2,SV,'Welche Übungswaffen sind in der SV zulässig?','Nur gefahrlose Übungswaffen (z. B. Stock und Messer); spitze, scharfe oder verletzungsträchtige Gegenstände sind verboten',['Echte Messer nach Prüferfreigabe','Nur Holzschwerter','Jede Waffe, wenn der Partner Schutz trägt'],'PO Erster Teil § 3 Nr. 6 f.',{re:[/gefahrlos|uebungs|ubungs|stock|messer/]});
h(3,2,SV,'Wird bei Jugendlichen unter 15 Jahren die Selbstverteidigung gegen Waffenangriffe geprüft?','Nein',['Ja, nur mit Stock','Ja, nur mit Messer','Ja, mit Schutzausrüstung'],'PO Erster Teil § 3 Nr. 6 a.',{re:[/nein|nicht|keine/]});
h(12,2,SV,'Wie lange darf das selbst erstellte SV-Programm bei Lehrergraden höchstens dauern?','3 Minuten',['1 Minute','5 Minuten','10 Minuten'],'PO Erster Teil § 3 Nr. 6 g; die Vorführung erfolgt mit eigenen Partnern.',{re:[/\b3\b|drei/]});
h(3,2,SV,'Wer bestimmt bei mehreren Angreifern in der SV die Positionen?','Der Anwärter',['Der Prüfer','Der Kampfleiter','Das Los'],'PO Erster Teil § 3 Nr. 6 c. SV-Übungen beginnen seitlich zum Prüfertisch.',{re:[/anwaerter|anwarter|prufling|pruefling/]});
/* --- Theorie & Geist --- */
h(0,1,TH,'Was bedeutet „Taekwondo“ wörtlich?','Weg des Fußes und der Faust (Tae = Fuß, Kwon = Faust, Do = Weg)',['Weg der leeren Hand','Kunst des Schwertes','Weg des Kampfes ohne Gewalt'],'Tae = Fuß (Treten), Kwon = Faust (Schlagen), Do = Weg (Lebensweg, Philosophie).',{kw:[[/fuss|fus/],[/faust|hand/],[/weg/]],need:2});
h(0,1,TH,'Welche Bedeutung hat der Kampfschrei (Kihap)?','Er bündelt die Energie, unterstützt Atmung und Körperspannung und zeigt Entschlossenheit',['Er dient nur der Einschüchterung','Er ist ein Zeichen für Aufgabe','Er ist eine Begrüßung des Prüfers'],'Kampfschrei zählt laut PO zu den physischen Voraussetzungen (z. B. Atmung, Körperspannung).',{re:[/energie|konzentr|atmung|spannung|entschlossen/]});
h(0,1,TH,'Was ist eine Poomsae?','Ein festgelegter Ablauf von Abwehr- und Angriffstechniken gegen imaginäre Gegner (Form)',['Ein Wettkampf gegen einen Partner','Ein Bruchtest','Ein Gürtelknoten'],'Poomsae = Formenlauf; Diagramm, Rhythmus und Kampfschrei werden bewertet.',{re:[/form|ablauf|imaginaer|imaginar|gegner|lauf/]});
h(4,2,TH,'Nenne mindestens drei der fünf Grundprinzipien (Tenets) des Taekwondo.','Yeui (Höflichkeit), Yeomchi (Integrität), Innae (Ausdauer), Geukgi (Selbstbeherrschung), Baekjeol Bulgul (unbeugsamer Geist)',['Yeui, Yeomchi, Hansu, Jitae, Ilyeo','Yin, Yang, Geon, Gon, Gam','Charyeot, Junbi, Sijak, Geuman, Baro'],'Die Tenets sind Teil der „Geistigen Hintergründe“ (5. Kup).',{kw:[[/hoeflich|hoflich|yeui|ye ui|courtesy|respekt/],[/integrit|yeomchi|ehrlich|anstand/],[/ausdauer|innae|durchhalt|hartnaeck|hartnack/],[/selbstbeherrsch|selbstkontroll|geukgi|kukki|guk ?gi/],[/unbeug|unbezwing|unbesieg|baekjeol|bulgul|unbeug|unerschuett|unerschutt/]],need:3});
h(4,2,TH,'Was bedeutet „Taegeuk“?','Urprinzip (das große Äußerste): die Harmonie von Yin und Yang (Eum und Yang)',['Wasserfall','Weiße Hand','Drachenfeder'],'Taegeuk (auch im Staatswappen/der Flagge Koreas) ist das Symbol für Harmonie der Gegensätze; die acht Formen stehen für die acht Trigramme.',{re:[/yin|yang|eum|urprinzip|harmonie|gegensatz/]});
h(0,2,TH,'Wofür steht Dojang wörtlich?','Ort, an dem der „Weg“ (Do) geübt wird: die Trainingshalle',['Der Gürtel','Das Kommando zum Beginn','Die Prüfungsordnung'],'Dojang = Übungsstätte des Weges.',{re:[/ort|halle|uebungs|ubungs|training|weg/]});
h(4,3,TH,'Nenne drei physische Voraussetzungen für wirksame Techniken laut PO.','z. B. Atmung, Gegenzug/Gegenbewegung, Hüfteinsatz, Körperspannung/-entspannung, Gleichgewicht, Schnelligkeit, Beweglichkeit, Reaktionsfähigkeit, Blickrichtung, Kampfschrei, Kraftausdauer',['Nur Körpergröße, Gewicht und Alter','Gürtelfarbe, Kondition, Bruchtestbretter','Schutzausrüstung, Dobok, Sportpass'],'PO Erster Teil § 3 Nr. 1 b.',{kw:[[/atm/],[/gegenzug|gegenbewegung/],[/huef|huf/],[/spannung|entspann/],[/gleichgewicht/],[/schnell|dynamik/],[/beweglich/],[/reaktion/],[/blick/],[/kampfschrei|kihap/],[/ausdauer|leistungsf/]],need:3});
h(4,3,TH,'Nenne drei technisch-motorische Prinzipien laut PO.','z. B. zweckmäßige, aufeinander abgestimmte Bewegungsabläufe, Koordination, Effizienz und Effektivität, Kraftwirkung, Brennpunkt',['Gürtelfarbe, Vorbereitungszeit, Prüfungsgebühr','Nur Schnelligkeit','Nur Kraft'],'PO Erster Teil § 3 Nr. 1 a.',{kw:[[/bewegungsablauf|ablaeufe|ablauf|abgestimmt/],[/koordination/],[/effizien/],[/effektiv/],[/kraftwirkung|kraft/],[/brennpunkt/]],need:3});
h(4,3,TH,'Nenne drei mentale Grundlagen laut PO.','z. B. Selbstdisziplin, Souveränität, Entschlossenheit, Zielgerichtetheit, Kampfgeist, Konzentration, Flexibilität, Harmonie, Respekt gegenüber dem Partner',['Reaktionsvermögen, Atmung, Hüfteinsatz','Gleichgewicht, Schnelligkeit, Dynamik','Körpergröße, Statur, Alter'],'PO Erster Teil § 3 Nr. 1 c.',{kw:[[/disziplin/],[/souver/],[/entschlossen/],[/zielgerichtet|ziel/],[/kampfgeist/],[/konzentration/],[/flexib/],[/harmonie/],[/respekt/]],need:3});
h(5,2,TH,'Wozu dient die Kenntnis der vitalen Körperpunkte im SV- und Kampfkontext?','Techniken zielgerichtet gegen empfindliche Punkte zu richten und gleichzeitig Verletzungen beim Training zu vermeiden',['Um Gegner zu verletzen','Um Bruchtests zu bestehen','Um die Gürtelfarbe zu bestimmen'],'Zum 4. Kup wird die „Kenntnis der vitalen Körperpunkte“ verlangt; Angriffstechniken im 1-Schritt-Kampf sind gegen einen vitalen Punkt zu richten.',{re:[/vital|empfindlich|wirkung|ziel|verletz/]});
h(8,2,TH,'Welche zusätzlichen Theorieinhalte kommen zum 1. Kup hinzu?','Organisation und Aufbau der DTU und des zuständigen Landesverbands sowie Grundkenntnisse zur Trainingslehre',['Notwehrrecht','Technikprinzipien','Vitale Körperpunkte'],'PO Erster Teil § 2, 1. Kup.',{kw:[[/dtu|landesverband|\blv\b|organisation|aufbau/],[/trainingslehre/]],need:1});
h(1,2,TH,'Welche Theorie kommt zum 8. Kup hinzu?','Wettkampfregeln nach WOZ oder WOP',['Notwehrrecht','Kenntnis der vitalen Körperpunkte','Technikprinzipien'],'WOZ = Wettkampfordnung für Zweikampf, WOP = Wettkampfordnung für Poomsae-Technik.',{re:[/wett.?kampf|woz|wop/]});
/* --- Poomsae allgemein --- */
h(9,2,PS,'Welche Pflichtform gilt neben einer Form aus dem Vorprogramm (nach Losvorgabe) zum 1. Dan?','Taegeuk Pal Jang (8. Form)',['Taegeuk Chil Jang','Koryeo','Keumgang'],'PO: 1. Poom/Dan = 1 Form aus dem Vorprogramm nach Losvorgabe + Taegeuk Pal Jang.',{fz:['Taegeuk Pal Jang','Pal Jang','Palgwe Pal Jang'],re:[/pal ?jang|8\.? ?form|achte/]});
h(9,2,PS,'Wie wird die Vorprogramm-Form bei Prüfungen zum 1. bis 3. Dan bestimmt, wie bei den Lehrergraden ab 4. Dan?','1.–3. Dan: nach Losvorgabe; 4. und 5. Dan: nach eigener Wahl',['Immer nach eigener Wahl','Immer nach Losvorgabe','Vom Landesverband festgelegt'],'PO § 2, Pflichtprogramm Technik.',{kw:[[/los/],[/eigen|wahl/]],need:2});
/* --- Verband & Struktur --- */
const VB='Verband & Struktur';
h(8,2,VB,'In welchen Dachverbänden ist die DTU Mitglied?','DOSB (Deutscher Olympischer Sportbund), ETU (Europa) und WT (Welt)',['Nur im DOSB','DOSB und ITF','ETU und ITF'],'Die DTU (gegründet 1981) ist der größte Taekwondo-Verband in Deutschland und der einzige, den der DOSB für die Olympischen Spiele zulässt.',{kw:[[/dosb/],[/etu|europa/],[/\bwt\b|world|welt/]],need:2});
h(8,2,VB,'Wofür steht „WT“?','World Taekwondo, der Weltverband',['Western Taekwondo','World Taekwondo Technique','Weltturnierverband'],'WT ist der Weltverband; die ETU (Europäische Taekwondo Union) ist der europäische Dachverband.',{re:[/world/]});
h(8,3,VB,'In welchem Jahr wurde die Deutsche Taekwondo Union gegründet?','1981',['1966','1972','1990'],'Angabe nach öffentlich zugänglicher Verbandsinformation (u. a. Wikipedia).',{re:[/1981/]});
h(8,3,VB,'Wie viele Landesverbände (LV) hat die DTU laut ihrer Website?','18',['12','16','20'],'Angabe der DTU-Website (abgerufen im Oktober 2026); die Zahl kann sich ändern. Die Landesverbände regeln u. a. Kup-Prüfungen, den Bezug von Prüfungsmaterial und Landes-Danprüfungen.',{re:[/\b18\b|achtzehn/]});
h(8,2,VB,'Welche Rolle hat der Kukkiwon für die Formen?','Das Welt-Taekwondo-Hauptquartier in Seoul; seine Vorgaben und Veröffentlichungen sind Maßstab für den Ablauf der Formen',['Der Name eines Wettkampfsystems der ETU','Der deutsche Prüfungsausschuss','Das Prüfungsorgan der DTU für Dan-Grade'],'PO Erster Teil § 3 Nr. 3 B: Ablauf, Technikausführung und Kampfschrei orientieren sich am DTU-Standard und an den Vorgaben des Kukkiwon.',{re:[/seoul|hauptquartier|welt/]});
h(8,2,VB,'Wer übt innerhalb der DTU die Fachaufsicht und Kontrolle über das Prüfungs- und Passwesen aus?','Der Bundesreferent für das Prüfungswesen (BPR)',['Der DTU-Präsident persönlich','Der jeweilige Landesverbandspräsident','Der Bundestrainer'],'PO Dritter Teil § 1 Nr. 2 a: Der BPR überwacht die Einhaltung der Ordnungen und regelt Sonderfälle. Er darf jederzeit Auskünfte von den LV verlangen.',{re:[/bpr|bundesreferent/]});
h(8,2,VB,'Wem obliegt laut PO die Prüfungshoheit?','Der DTU',['Dem Landesverband','Dem ausrichtenden Verein','Dem Prüfer'],'PO Dritter Teil § 1 Nr. 2 a.',{re:[/dtu|deutsche taekwondo/]});
h(8,3,VB,'Wer entscheidet über Angelegenheiten, die in der PO nicht geregelt sind?','Der BPR; er kann dabei Verfahrensabläufe vorgeben',['Das DTU-Präsidium','Der Landesverband','Die Mitgliederversammlung (MV)'],'PO Dritter Teil § 1 Nr. 2 e.',{re:[/bpr|bundesreferent/]});
h(8,3,VB,'Wer entscheidet bei Besonderheiten während einer Landes-Danprüfung, die weder die PO noch das sonstige Regelwerk klärt?','Der LPR (Landesprüfungsreferent), im Sinne des Anwärters',['Der BPR','Der Prüfer allein','Der Landesverband per Abstimmung'],'PO Dritter Teil § 1 Nr. 2 d: Kup- und Vereins-Danprüfungen: Prüfer bzw. Kommissionsvorsitzender; Landes-Danprüfungen: LPR; Bundes-Danprüfungen: BPR. Immer im Sinne des Anwärters.',{re:[/lpr|landespruef|landesprüf|landesreferent/]});
h(8,3,VB,'Wer entscheidet bei einer Bundes-Danprüfung über Besonderheiten, die die PO nicht regelt?','Der BPR',['Der LPR','Der Prüfer allein','Der DTU-Vizepräsident'],'PO Dritter Teil § 1 Nr. 2 d, jeweils im Sinne des Anwärters.',{re:[/bpr|bundesreferent/]});
h(8,3,VB,'Kann der BPR Prüfungsaufgaben an die Landesverbände übertragen?','Ja: Kontrolle und das Recht, Landes-Danprüfungen sowie Kup- und Vereins-Danprüfungen durchzuführen, kann er auf LV bzw. Vereine übertragen; im begründeten Fall zieht er sie wieder an sich',['Nein, alle Prüfungen führt er selbst durch','Nur Bundes-Danprüfungen','Nur Kup-Prüfungen, ohne Rückholmöglichkeit'],'PO Dritter Teil § 1 Nr. 2 b.',{re:[/\bja\b|uebertr|ubertr|delegier/]});
h(8,3,VB,'Was besagt das „Konkurrenzverbot“ in der PO?','LV und ihre Mitglieder dürfen außerhalb der Vorgaben der PO keine TKD-Prüfungen veranstalten oder durchführen',['Prüfer dürfen nicht für mehrere Vereine prüfen','Zwei Vereine dürfen nicht am gleichen Tag prüfen','Anwärter dürfen nicht bei zwei Verbänden prüfen'],'PO Dritter Teil § 1 Nr. 6.',{re:[/ausser|nicht.*pruef|nicht.*pruf|keine.*pruef|keine.*pruf/]});
h(8,2,VB,'Wo werden Sportpässe, Prüfungslisten, Urkunden und Prüfungsmarken bezogen?','Beim zuständigen Landesverband; der Erwerb bei einem anderen LV ist nicht zulässig',['Beim Verein','Beim Prüfer','Beim Weltverband WT'],'PO Dritter Teil § 2 Nr. 3. Es dürfen nur die von der DTU bestimmten Dokumente und Muster verwendet werden.',{re:[/landesverband|\blv\b/]});
h(8,3,VB,'Wer stellt den Landesverbänden die Dan-Urkunden zur Verfügung?','Die DTU; die Kosten richten sich nach der FGO',['Der Weltverband WT','Der jeweilige Verein','Der Kukkiwon'],'PO Dritter Teil § 2 Nr. 4 a. Nachbestellungen von Urkunden und Chipkarten beantragt man beim BPR gegen Gebühr.',{re:[/dtu|deutsche taekwondo/]});
h(8,3,VB,'Wie kommen Kup-Urkunden und Prüfungsmarken zu den Vereinen?','Die DTU stellt sie den LV kostenpflichtig zur Verfügung; die LV beliefern ihre Vereine und dürfen einen Aufschlag erheben',['Der Prüfer bringt sie mit','Die Vereine bestellen direkt bei der DTU','Der Prüfer druckt sie selbst aus'],'PO Dritter Teil § 2 Nr. 5 a.',{kw:[[/dtu/],[/landesverband|\blv\b/]],need:2});
h(8,3,VB,'Wer zahlt die Aufwandsentschädigung der Prüfer bei Kup- und Vereins-Danprüfungen, bei Landes-Danprüfungen und bei Bundes-Danprüfungen?','Verein, LV, DTU (in dieser Reihenfolge)',['LV, DTU, Verein','DTU, DTU, LV','Verein, Verein, DTU'],'PO Dritter Teil § 2 Nr. 7.',{kw:[[/verein/],[/\blv\b|landesverband/],[/dtu/]],need:3});
h(8,3,VB,'Welche Ehrendangrade erkennt die DTU an?','Die von der ETU und der WT verliehenen; Ehrendane anderer Organisationen sind unbeachtlich',['Alle Ehrendane weltweit','Nur die von der DTU selbst verliehenen','Die von Vereinen verliehenen'],'PO Dritter Teil § 1 Nr. 1 b: Die Verleihung ist in der EO (Ehrenordnung) geregelt.',{kw:[[/etu|europ/],[/\bwt\b|world/]],need:1});
h(8,2,VB,'Wer darf Kupgrade in den DTU-Sportpass eintragen?','Der BPR, vom LV beauftragte Personen und Prüfer mit gültiger Prüferlizenz',['Jeder Trainer','Jeder Vereinsvorstand','Nur der Anwärter selbst'],'PO Dritter Teil § 2 Nr. 2 a.',{kw:[[/bpr/],[/pruef|pruf/],[/\blv\b|landesverband|beauftragt/]],need:2});
h(9,3,VB,'Wer darf Poom- und Dangrade in den DTU-Sportpass eintragen?','Der BPR, vom LV beauftragte Personen, bei Vereins-Danprüfungen der Kommissionsvorsitzende bzw. der jeweilige Prüfer',['Jeder Vereinstrainer','Nur der Landesverbandsvorstand','Jeder Prüfer mit Lizenz C'],'PO Dritter Teil § 2 Nr. 2 b. Bei Danprüfungen werden keine Prüfungsmarken eingeklebt.',{kw:[[/bpr/],[/kommission|vorsitz/],[/\blv\b|landesverband|beauftragt/]],need:2});
h(8,2,VB,'Wo werden erworbene Graduierungen zentral erfasst, und ab wann werden sie wirksam?','In der DTU-Verwaltungsdatenbank (DB); mit dem Eintrag, und zwar rückwirkend ab dem Prüfungstag',['Beim Kukkiwon; ab Ausstellung der Urkunde','Beim DOSB; nach 3 Wochen','Im Verein; ab Eintrag im Sportpass'],'PO Dritter Teil § 2 Nr. 1.',{re:[/datenbank|\bdb\b/]});
h(9,3,VB,'Welche Anforderung gilt an den Kommissionsvorsitzenden und die Beisitzer bei Landes- und Bundes-Danprüfungen?','Vorsitzender mindestens den angestrebten Dangrad; Beisitzer mindestens den Dangrad, den der Prüfling zum Prüfungszeitpunkt innehat',['Alle Prüfer mindestens 5. Dan','Vorsitzender mindestens 1. Dan über dem Prüfling, Beisitzer gleichrangig','Beliebige Prüfer mit Lizenz A'],'PO Zweiter Teil § 1 Nr. 6 b.',{kw:[[/angestreb/],[/innehat|aktuell|zum zeitpunkt|besitzt/]],need:1});
h(9,3,VB,'Wer kann bei Ausfall eines Kommissionsmitglieds (bis zum 3. Dan) einspringen?','Das für das Prüfungswesen zuständige Vorstandsmitglied des LV (unabhängig vom Dangrad); der BPR jederzeit; steht keiner zur Verfügung, fällt die Prüfung aus',['Jeder anwesende Prüfer mit Lizenz C','Der Trainer des Anwärters','Ein weiterer Anwärter'],'PO Zweiter Teil § 1 Nr. 6 c.',{kw:[[/vorstand|\blv\b|landesverband/],[/bpr/]],need:1});
h(8,2,VB,'Dürfen DTU-Prüfungen im Ausland stattfinden?','Ja, bis zum 3. Dan, im europäischen Ausland und mit DTU-lizenzierten Prüfern',['Nein, nur in Deutschland','Ja, weltweit alle Grade','Ja, nur bis zum 1. Kup'],'PO Dritter Teil § 1 Nr. 4: bei Trainingsmaßnahmen; Abwicklung über die DTU-Datenbank.',{re:[/europ/]});
h(8,3,VB,'Welche Fristen gelten für Kup-Prüfungen im Ausland?','Information und Genehmigung des LV spätestens 3 Monate vorher; Teilnehmer und Prüfer spätestens 14 Tage vorher melden',['Anzeige 4 Wochen vorher beim BPR','Keine Fristen','Anzeige 1 Jahr vorher'],'PO Dritter Teil § 1 Nr. 4. Bei Danprüfungen ist der BPR zuständig, und ein von ihm beauftragter Offizieller muss anwesend sein.',{kw:[[/3 monat|drei monat/],[/14 tage|vierzehn/]],need:1});
h(9,3,VB,'Wer muss bei Dan-Prüfungen im Ausland anwesend sein?','Ein vom BPR beauftragter Offizieller',['Der DTU-Präsident','Ein Vertreter der WT','Der Landesverbandspräsident'],'PO Dritter Teil § 1 Nr. 4 d.',{re:[/bpr|offiziell/]});
h(9,3,VB,'Wer entscheidet, ob Vereins-Danprüfungen zum 2. und 3. Dan/Poom angeboten werden?','Der jeweilige Landesverband für seinen Zuständigkeitsbereich',['Der DTU-Präsident','Der ausrichtende Verein','Der BPR'],'PO Dritter Teil § 1 Nr. 3. Die Entscheidung ist in geeigneter Form zu veröffentlichen.',{re:[/landesverband|\blv\b/]});
h(8,3,VB,'Was gilt bei Verlust des DTU-Passes?','Prüfungsmarken müssen nicht nachgeklebt werden; die Eintragung erfolgt ausschließlich durch den LPR, wenn ein DB-Eintrag oder lückenloser Urkundennachweis vorliegt',['Alle Prüfungen müssen wiederholt werden','Der Verein trägt die Grade neu ein','Die Graduierung verfällt'],'PO Dritter Teil § 2 Nr. 9.',{re:[/lpr|landespruef|landesprüf|nicht nachge|datenbank/]});
h(8,3,VB,'Wer kann Sonderregelungen zur Graduierung für Sportler des Bundeskaders treffen?','Das Präsidium (damit sie an internationalen Turnieren teilnehmen können)',['Der BPR allein','Der Landesverband','Der Prüfer'],'PO Dritter Teil § 1 Nr. 1 c. In anderen begründeten Einzelfällen entscheidet der BPR im Benehmen mit dem zuständigen DTU-Vizepräsidenten.',{re:[/praesidium|prasidium/]});
h(8,3,VB,'Wer kann zeitlich befristete Ausnahmen von der Präsenzpflicht bei Prüfungen beschließen?','Das Präsidium',['Der Prüfer','Der BPR allein','Der Verein'],'PO Zweiter Teil § 2 Nr. 1 a: Grundsätzlich müssen Prüfer und Anwärter physisch anwesend sein.',{re:[/praesidium|prasidium/]});
h(9,3,VB,'Welche Kleidung tragen Prüfer bei Danprüfungen laut PO einheitlich?','Blauer Blazer/Sakko, graue Hose, weißes Hemd, passende Krawatte, weiße Socken und weiße Hallenschuhe',['Dobok in Schwarz','Anzug in Schwarz mit schwarzer Krawatte','Freie Sportkleidung'],'Bei Kup-Prüfungen kann der Prüfer Zivil- oder Sportkleidung oder einen Dobok tragen (PO Zweiter Teil § 1 Nr. 3).',{kw:[[/blau|blazer|sakko/],[/grau/],[/weiss|weis/]],need:2});
h(8,2,VB,'Was gilt für die Kleidung des Prüfers bei Kup-Prüfungen?','Zivil- oder Sportkleidung oder Dobok',['Immer Dobok','Immer Anzug','Blauer Blazer und graue Hose'],'PO Zweiter Teil § 1 Nr. 3 a.',{re:[/zivil|sport|dobok/]});
h(8,2,VB,'Darf ein eingesetzter Prüfer bei derselben Prüfung auch Anwärter oder Betreuer sein?','Nein (Verbot der Mehrfachfunktion)',['Ja, als Betreuer','Ja, als Anwärter','Ja, wenn der BPR zustimmt'],'PO Zweiter Teil § 1 Nr. 4.',{re:[/nein|nicht|verbot/]});
h(9,3,VB,'Innerhalb welcher Frist werden bei Vereins- und Landes-Danprüfungen neue Graduierungen in die DTU-DB eingetragen?','Innerhalb von 7 Kalendertagen',['Innerhalb von 24 Stunden','Innerhalb von 3 Wochen','Innerhalb von 3 Monaten'],'PO Zweiter Teil § 1 Nr. 6 h; der Kommissionsvorsitzende leitet die Prüfungslisten nach der Prüfung digital an LV bzw. LPR.',{re:[/\b7\b|sieben/]});
h(9,3,VB,'Welchen Bonuswert hat die Bundes-Kampfrichter-Lizenz bei der Bonusregelung (Poom/Dan)?','0,8',['0,4','0,6','1,0'],'PO Zweiter Teil § 2 Nr. 8 g: Kampfrichter-Anwärter 0,4; Landes-Kampfrichter 0,6; Bundes-Kampfrichter 0,8; WT-Coach 1,0; WT-Kampfrichter 1,5.',{re:[/0[,.]8/]});

h(9,3,VB,'Welchen Bonuswert hat die Trainer-B-Lizenz TKD (2. Lizenzstufe)?','1,0',['0,8','1,2','1,5'],'Trainer C = 0,8 (1.–5. Dan); Trainer B = 1,0; Trainer A = 1,2; Diplomtrainer = 1,5. Lizenzen, die als Zulassungsvoraussetzung dienen, zählen nicht für die Bonusregelung.',{re:[/1[,.]0|\b1\b/]});
/* --- Formenlauf (Poomsae) --- */
h(2,1,PS,'Mit welchem Kommando beginnt die Vorbereitung auf eine Form, und mit welcher Stellung startet man üblicherweise?','Junbi (Bereit) in der Bereitschaftsstellung Naranhi Junbi Seogi',['Sijak in der Reiterstellung','Geuman in der Kranichstellung','Baro in der Tigerstellung'],'Eine Form beginnt (nach Kyeongnye) in der Bereitschaftsstellung und endet mit Baro (Rückkehr in die Ausgangsstellung).',{re:[/junbi|bereit|naranhi/]});
h(2,2,PS,'Mit welchem Kommando endet eine Form?','Baro (Zurück in die Ausgangsstellung)',['Sijak (Beginnen)','Charyeot (Achtung)','Swieo (Entspannen)'],'Nach Baro folgt die Verbeugung (Kyeongnye).',{re:[/baro/]});
h(2,2,PS,'Wie ist das Diagramm (Laufbahn) der acht Taegeuk-Formen aufgebaut?','Drei parallele Linien, auf jeder erfolgt eine 180°-Drehung',['Zwei Linien mit je 90°-Drehung','Ein Kreuz aus vier Linien','Eine Linie ohne Drehung'],'Je nach Form wird die Drehung entweder mit Fuß-zurück („durchgezogene“ Linie) oder auf der Stelle („unterbrochene“ Linie) ausgeführt; daraus ergeben sich die Trigramme.',{kw:[[/drei|3/],[/180|umkehr|halbe|dreh/]],need:2});
h(3,3,PS,'Was bedeutet bei den Taegeuk-Trigrammen eine „durchgezogene“ Linie in der Laufbahn?','Die Drehung wird ausgeführt, indem der vordere Fuß nach hinten gesetzt wird',['Die Drehung erfolgt auf der Stelle','Die Drehung erfolgt im Sprung','Die Drehung erfolgt rückwärts'],'Dreht man auf der Stelle (Drehpunkt), ist die Linie „unterbrochen“.',{re:[/fuss.*hinten|zurueck|zuruck|nach hinten/]});
h(2,1,PS,'Welcher Tritt kommt in Taegeuk Il Jang vor?','Ap Chagi (Frontkick)',['Yeop Chagi (Seitkick)','Dollyeo Chagi (Halbkreistritt)','Dwit Chagi (Rückwärtstritt)'],'Taegeuk Il Jang (Geon, Himmel) kennt Gehstellung und Vorwärtsbeugestellung, Arae Makgi, Momtong Makgi, Eolgul Makgi, Momtong Jirugi und Ap Chagi.',{fz:['Ap Chagi','Frontkick'],re:[/ap ?chagi|front|vorw/]});
h(2,2,PS,'Welche Techniken enthält Taegeuk Il Jang?','Arae Makgi, Momtong Makgi, Eolgul Makgi, Momtong Jirugi und Ap Chagi',['Sonnal Makgi, Palkup Chigi und Yeop Chagi','Gawi Makgi, Mureup Chigi und Twio Chagi','Dollyeo Chagi und Batangson Makgi'],'Taegeuk Il Jang ist die erste Form (7. Kup), Trigramm Geon (Himmel).',{kw:[[/arae|tief|unten/],[/momtong|mitte/],[/eolgul|hoch|kopf/],[/jirugi|fauststoss|stoss|faust/],[/ap ?chagi|front/]],need:3});
h(3,2,PS,'Was bringt Taegeuk Ee Jang neu gegenüber Il Jang?','Fauststoß zum Kopf (Eolgul Jirugi), Übergang von Gehstellung in Vorwärtsbeugestellung und eine Tritt-Stoß-Kombination',['Handkantenhalsschlag und Speerhand','Ellbogenstöße und Seitwärtstritte','Sprungtritte und Scherenblock'],'Taegeuk Ee Jang (Tae, See): Drehungen Fuß zurück, Fuß zurück, auf der Stelle.',{kw:[[/eolgul|kopf|hoch/],[/jirugi|stoss|faust/],[/kombination|tritt/]],need:2});
h(4,2,PS,'Welche Handkantentechnik zeichnet Taegeuk Sam Jang aus?','Handkanten-Halsschlag (Sonnal Mok Chigi) und Handkantenabwehr nach außen',['Speerhandstoß','Doppelter Handkantenblock am Anfang','Handkantenblock nach innen'],'Taegeuk Sam Jang (Ri, Feuer) beginnt mit Frontkick und Doppelstoß und schließt mit Tiefblock, Tritt und Stoß; es soll „mit Energie wie Feuer“ gelaufen werden.',{re:[/hals|mok|nacken|neck|handkante/]});
h(4,2,PS,'Welche Technikfolge steht am Anfang von Taegeuk Sam Jang?','Ap Chagi (Frontkick) gefolgt von einem Doppelstoß',['Doppelter Handkantenblock','Arae Makgi mit Ap Seogi','Ellbogenstoß mit Seitwärtstritt'],'Siehe Kukkiwon-Standard (Taekwondo Textbook).',{re:[/ap ?chagi|front/]});
h(5,2,PS,'Mit welcher Technik beginnt Taegeuk Sa Jang?','Mit einem doppelten Handkantenblock',['Mit Arae Makgi','Mit Ap Chagi','Mit Eolgul Jirugi'],'Taegeuk Sa Jang (Jin, Donner) bringt zudem Speerhandstoß (Pyeonsonkkeut Jirugi), Seitwärtstritt (Yeop Chagi) und den „Schwalbenform“-Schlag (Jebipum Mok Chigi).',{re:[/doppel.*hand|handkante/]});
h(5,3,PS,'Wie heißt die Technik, bei der hohe Handkantenabwehr und Handkanten-Halsschlag gleichzeitig ausgeführt werden (Taegeuk Sa Jang)?','Jebipum Mok Chigi (Schwalbenform-Schlag)',['Gawi Makgi (Scherenblock)','Batangson Makgi (Handballenblock)','Keumgang Makgi (Diamantblock)'],'Jebipum = Schwalbenform, Mok = Hals, Chigi = Schlag.',{fz:['Jebipum Mok Chigi','Jebipum'],vs:['Gawi Makgi','Batangson Makgi','Keumgang Makgi']});
h(5,3,PS,'Wie heißt der Speerhandstoß (Taegeuk Sa Jang)?','Pyeonsonkkeut Jirugi',['Sonnal Mok Chigi','Palkup Chigi','Momtong Jirugi'],'Pyeon Sonkkeut = flache Fingerspitzen (Speerhand).',{fz:['Pyeonsonkkeut Jirugi','Pyeonsonkkeut','Pyeon Sonkkeut Jirugi'],vs:['Sonnal Mok Chigi','Palkup Chigi','Momtong Jirugi']});
h(6,2,PS,'Welche Technikgruppe prägt Taegeuk Oh Jang?','Ellbogentechniken (Palkup Chigi), dazu Seitwärtstritte mit gleichzeitigem Handschlag',['Sprungtritte','Scherenblöcke','Handkantenhalsschläge'],'Taegeuk Oh Jang (Seon, Wind): sanft, aber unnachgiebig wie der Wind; Drehungen: auf der Stelle, Fuß zurück, Fuß zurück.',{re:[/ellb|palkup|elbow/]});
h(7,2,PS,'Welcher Tritt prägt Taegeuk Yuk Jang?','Dollyeo Chagi (Halbkreistritt)',['Ap Chagi','Naeryeo Chagi','Twio Chagi'],'Taegeuk Yuk Jang (Gam, Wasser) hat Halbkreistritt und Drehabwehr (Twist Block), Handflächenblöcke zum Schluss.',{fz:['Dollyeo Chagi','Halbkreistritt'],re:[/halbkreis|dollyeo|round/],vs:['Ap Chagi','Yeop Chagi','Dwit Chagi','Naeryeo Chagi']});
h(7,3,PS,'Was ist an Taegeuk Yuk Jang besonders?','Es ist die einzige Taegeuk-Form mit Rückwärtsschritten (am Ende in Rückwärtsbeuge- und Vorwärtsbeugestellung)',['Sie enthält als einzige Form Sprungtritte','Sie besteht aus nur zwei Linien','Sie wird ohne Kampfschrei gelaufen'],'Nach Kukkiwon-Beschreibung; in der Mitte steht ein langsam ausgeführter Tiefblock auf acht Zählzeiten.',{re:[/rueckwaerts|ruckwarts|zurueck|zuruck/]});
h(8,2,PS,'In welcher Stellung beginnt Taegeuk Chil Jang?','In der Tigerstellung (Beom Seogi)',['In der Reiterstellung','In der Kranichstellung','In der Kreuzstellung'],'Taegeuk Chil Jang (Gan, Berg): Drehungen auf der Stelle, auf der Stelle, Fuß zurück.',{fz:['Beom Seogi','Bom Seogi'],re:[/tiger|beom/]});
h(8,3,PS,'Welche Techniken kommen in Taegeuk Chil Jang vor?','Scherenblock (Gawi Makgi), Handballenblock, Rückhandschlag, Kniestoß (Mureup Chigi), Tiefblock mit doppelter Handkante',['Nur Faust- und Fußstöße','Sprungtritte und Drehtritte','Ellbogenstöße mit Seitwärtstritt'],'Taegeuk Chil Jang ist die 7. Form (1. Kup).',{kw:[[/schere|gawi/],[/knie|mureup/],[/handball|batangson|palm/],[/handkante|sonnal/]],need:2});
h(9,3,PS,'Welche Besonderheit hat der Sprungtritt in Taegeuk Pal Jang?','In einem einzigen Sprung wird zweimal getreten, einmal mit jedem Bein',['Er ist ein Drehsprungtritt nach hinten','Er wird als Sprung-Seitwärtstritt ausgeführt','Er wird nur mit dem Standbein ausgeführt'],'Taegeuk Pal Jang (Gon, Erde, 8. Form) enthält außerdem Tigerstellung, Kreuzstellung, Frontkick mit anschließendem Sprung-Frontkick und halben Bergblock.',{re:[/zweimal|2 ?x|jedes bein|beide beine|einem sprung/]});
h(9,2,PS,'Welche Stellung kommt in der Mittellinie von Taegeuk Pal Jang vor?','Tigerstellung (Beom Seogi)',['Kranichstellung','Reiterstellung','Rückwärtsbeugestellung'],'Dort steht in der Tigerstellung ein doppelter Handkantenblock nach vorn.',{re:[/tiger|beom/]});
h(10,3,PS,'Welche Stellung ist typisch für Poomsae Koryeo und Keumgang?','Hakdari Seogi (Kranichstellung, Einbeinstand)',['Juchum Seogi (Reiterstellung)','Dwit Kubi (Rückwärtsbeuge)','Moa Seogi (geschlossene Stellung)'],'Beide Formen enthalten die Kranichstellung; Keumgang außerdem den Diamantblock (Keumgang Makgi) und den Bergblock (San Makgi).',{fz:['Hakdari Seogi','Kranichstellung'],re:[/kranich|hakdari|einbein/],vs:['Juchum Seogi','Dwit Kubi','Moa Seogi','Beom Seogi']});
h(10,3,PS,'Welches Schriftzeichen bildet das Diagramm der Poomsae Koryeo?','士 (Gelehrter)',['山 (Berg)','十 (Zehn)','一 (Eins)'],'Koryeo: 士 (Seonbi, Gelehrter); Keumgang: 山 (Berg); Pyeongwon: 一 (Eins, Ebene); Sipjin: 十 (Zehn).');
h(11,3,PS,'Welches Schriftzeichen bildet das Diagramm der Poomsae Keumgang?','山 (Berg)',['士 (Gelehrter)','十 (Zehn)','一 (Eins)'],'Keumgang: 山 (Berg).');
h(12,3,PS,'Welches Schriftzeichen bildet das Diagramm der Poomsae Pyeongwon?','一 (Eins; Ebene)',['士 (Gelehrter)','山 (Berg)','十 (Zehn)'],'Pyeongwon: 一, die gerade Linie der weiten Ebene.');
h(13,3,PS,'Welches Schriftzeichen bildet das Diagramm der Poomsae Sipjin?','十 (Zehn)',['士 (Gelehrter)','山 (Berg)','一 (Eins)'],'Sipjin: 十, das Dezimalsystem; Zehn als Zeichen für Vollkommenheit.');
/* generierte Fragen werden unten ergänzt */

/* ===================== FRAGEN BAUEN ===================== */
const POOL=[];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
H.forEach((q,i)=>{q.id='h'+i;q.fam='h'+i;POOL.push(q)});
const add=(o)=>POOL.push(o);

/* Vokabelfragen */
V.forEach(e=>{
  const sameCat=V.filter(x=>x.c===e.c&&x.id!==e.id);
  const others=V.filter(x=>x.id!==e.id);
  const distDe=shuffle(sameCat).slice(0,4).map(x=>x.de);
  while(distDe.length<4){const x=shuffle(others)[0];if(x&&!distDe.includes(x.de)&&x.de!==e.de)distDe.push(x.de)}
  const distK=shuffle(sameCat).slice(0,4).map(x=>x.k);
  while(distK.length<4){const x=shuffle(others)[0];if(x&&!distK.includes(x.k)&&x.k!==e.k)distK.push(x.k)}
  const cat=e.c.replace(/ \(.*\)/,'');
  const exp=`${e.k} = ${e.de}${e.a&&e.a.length&&e.a[0]!==e.k?` (auch geschrieben: ${e.a.slice(0,2).join(', ')})`:''}. Rubrik: ${e.c}.`;
  if(e.num){
    add({id:'vn'+e.id,fam:'v'+e.id,g:e.g,d:e.g>0?2:1,c:'Begriffe & Kommandos',q:`Welche Zahl bedeutet „${e.k}“ im ${e.c.includes('sino')?'sino-koreanischen':'rein koreanischen'} Zählsystem?`,a:e.de,w:shuffle(V.filter(x=>x.c===e.c&&x.id!==e.id).map(x=>x.de)).slice(0,4),x:exp,re:[e.d]});
    add({id:'vk'+e.id,fam:'v'+e.id,g:e.g,d:2,c:'Begriffe & Kommandos',q:`Wie heißt die Zahl ${e.de} im ${e.c.includes('sino')?'sino-koreanischen (Taegeuk-Namen, Gürtelgrade)':'rein koreanischen (Zählen von Techniken)'} Zählsystem auf Koreanisch?`,a:e.k,w:distK,x:exp,fz:[e.k,...e.a],vs:others.filter(x=>x.num&&x.c===e.c).flatMap(x=>[x.k,...x.a])});
  }else{
    add({id:'vd'+e.id,fam:'v'+e.id,g:e.g,d:e.g<=1?1:2,c:'Begriffe & Kommandos',q:`Was bedeutet „${e.k}“ (${cat})?`,a:e.de,w:distDe,x:exp,re:[e.d]});
    add({id:'vk'+e.id,fam:'v'+e.id,g:e.g,d:e.g<=1?2:3,c:'Begriffe & Kommandos',q:`Wie lautet der koreanische Begriff für „${e.de}“?`,a:e.k,w:distK,x:exp,fz:[e.k,...e.a],vs:others.flatMap(x=>[x.k,...x.a])});
  }
});

/* Programm-Fragen aus der PO */
const KUP_FORM=[null,null,0,1,2,3,4,5,6];  // Index im Grad -> Taegeuk-Index
GR.forEach((gr,i)=>{
  if(i>=0&&i<=8){
    const others=GR.slice(0,9).filter((_,j)=>j!==i);
    add({id:'pb'+i,fam:'pb'+i,g:i,d:i<5?1:2,c:'Prüfungsordnung',q:`Welcher Gürtel gehört zum ${gr.n}?`,a:gr.belt,w:shuffle(others).slice(0,4).map(x=>x.belt),x:`PO § 1 Nr. 5: ${gr.n} = ${gr.belt}.`});
    if(i>0)add({id:'pp'+i,fam:'pp'+i,g:i,d:2,c:'Prüfungsordnung',q:`Welche Mindest-Vorbereitungszeit gilt für die Prüfung zum ${gr.n}?`,a:gr.prep,w:shuffle([...new Set(GR.filter((_,j)=>j!==i).map(x=>x.prep))].filter(p=>p!==gr.prep)).slice(0,4),x:`PO § 2, Programm ${gr.n}: ${gr.prep}.`,re:[new RegExp(gr.prep.match(/(\d+) (Monate|Jahre?)/)[1]+'\\s*'+(gr.prep.includes('Monate')?'monat':'jahr'))]});
  }
});
/* Formenzuordnung Kup */
for(let i=2;i<=8;i++){
  const t=TAE[KUP_FORM[i]];
  const othersT=TAE.filter(x=>x!==t);
  add({id:'pf'+i,fam:'pf'+i,g:i,d:2,c:'Poomsae',q:`Welche Taegeuk-Form gehört im Pflichtprogramm zur Prüfung zum ${GR[i].n} (Technik)?`,a:`${t.n}. Form – ${t.k}`,w:shuffle(othersT).slice(0,4).map(x=>`${x.n}. Form – ${x.k}`),x:`PO § 2: ${GR[i].n} verlangt die ${t.n}. Form (${t.k}).`,re:[new RegExp('\\b'+t.n+'\\b|'+t.k.split(' ')[1].toLowerCase()+' ?jang')]});
  add({id:'pk'+i,fam:'pf'+i,g:i,d:2,c:'Poomsae',q:`Für welche Graduierung ist ${t.k} (${t.n}. Form) die neue Pflichtform?`,a:GR[i].n,w:shuffle(GR.slice(2,9).filter((_,j)=>j+2!==i)).slice(0,4).map(x=>x.n),x:`${t.k} ist die ${t.n}. Form: Pflichtform zur Prüfung zum ${GR[i].n}.`,re:[new RegExp('\\b'+GR[i].n.split('.')[0]+'\\.?\\s*kup')]});
}
/* Taegeuk-Details */
TAE.forEach((t,i)=>{
  const g=i<7?KUP_FORM.indexOf(i):9;
  add({id:'tn'+i,fam:'tn'+i,g,d:2,c:'Poomsae',q:`Wie heißt die ${t.n}. Taegeuk-Form auf Koreanisch?`,a:t.k,w:shuffle(TAE.filter(x=>x!==t)).slice(0,4).map(x=>x.k),x:`${t.n}. Form = ${t.k} (Jang = Kapitel/Abschnitt). Trigramm: ${t.tri} (${t.de}).`,fz:[t.k,t.k.replace('Taegeuk ',''),'Taeguk '+t.k.split(' ').slice(1).join(' ')],vs:TAE.filter(x=>x!==t).flatMap(x=>[x.k,x.k.replace('Taegeuk ','')])});
  add({id:'tt'+i,fam:'tt'+i,g,d:3,c:'Poomsae',q:`Welches Trigramm (Naturelement) steht für ${t.k}?`,a:`${t.tri} – ${t.de}`,w:shuffle(TAE.filter(x=>x!==t)).slice(0,4).map(x=>`${x.tri} – ${x.de}`),x:`${t.k}: ${t.tri} = ${t.de}. Reihenfolge: Geon (Himmel), Tae (See), Ri (Feuer), Jin (Donner), Seon (Wind), Gam (Wasser), Gan (Berg), Gon (Erde).`,re:[new RegExp(t.tri.toLowerCase()+'|'+t.de.split(' ')[0].toLowerCase().replace('ö','o'))]});
  add({id:'tm'+i,fam:'tm'+i,g,d:3,c:'Poomsae',q:`Wie viele Bewegungen hat ${t.k} (Kukkiwon-Standard)?`,a:String(t.mv),w:[...new Set(TAE.map(x=>String(x.mv)))].filter(x=>x!==String(t.mv)),x:`${t.k} hat ${t.mv} Bewegungen. (1: 18, 2: 18, 3: 20, 4: 20, 5: 20, 6: 19, 7: 25, 8: 27)`,re:[new RegExp('\\b'+t.mv+'\\b')]});
});
/* Höhere Poomsae */
POO.forEach((p,i)=>{
  const g=9+Math.min(8,[0,1,2,3,5,5,6,7,8][i]+1);
  const gi=Math.min(17,[10,11,12,12,13,14,15,16,17][i]);
  const others=POO.filter(x=>x!==p);
  add({id:'ph'+i,fam:'ph'+i,g:gi,d:3,c:'Poomsae',q:`Welche Bedeutung hat die Poomsae ${p.k}?`,a:p.de,w:shuffle(others).slice(0,4).map(x=>x.de),x:`${p.k}: ${p.de}. In der PO verlangt für den ${p.dan}.`,re:[p.re]});
  add({id:'pd'+i,fam:'pd'+i,g:gi,d:3,c:'Poomsae',q:`Zu welchem Dan wird ${p.k} als Pflichtform verlangt?`,a:p.dan,w:shuffle(others).slice(0,4).map(x=>x.dan).filter(d=>d!==p.dan),x:`PO § 2: ${p.k} = ${p.dan}. Folge: 2. Dan Koryeo, 3. Dan Keumgang, 4. Dan Taebaek + Pyeongwon, 5. Dan Pyeongwon + Sipjin, 6. Dan Sipjin + Jitae, 7. Dan Jitae + Cheonkwon, 8. Dan Cheonkwon + Hansu, 9. Dan Hansu + Ilyeo.`,re:[new RegExp(p.dan.split('.')[0]+'\\.?\\s*dan')]});
  add({id:'pm'+i,fam:'pm'+i,g:gi,d:3,c:'Poomsae',q:`Wie viele Bewegungen hat Poomsae ${p.k} (Kukkiwon-Standard)?`,a:String(p.mv),w:[...new Set(POO.map(x=>String(x.mv)))].filter(x=>x!==String(p.mv)),x:`${p.k} hat ${p.mv} Bewegungen (Koryeo 30, Keumgang 27, Taebaek 26, Pyeongwon 25, Sipjin 29, Jitae 28, Cheonkwon 29, Hansu 27, Ilyeo 25).`,re:[new RegExp('\\b'+p.mv+'\\b')]});
});
/* Theorie je Grad */
const THEO=[[1,'Wettkampfregeln nach WOZ oder WOP'],[3,'Notwehrrecht (sinngemäß)'],[4,'Geistige Hintergründe des Taekwondo'],[5,'Kenntnis der vitalen Körperpunkte'],[6,'Beschreibung und Erklärung der Trainingsinhalte'],[7,'Technikprinzipien'],[8,'Organisation/Aufbau der DTU und des zuständigen Landesverbands + Grundkenntnisse zur Trainingslehre']];
THEO.forEach(([g,t])=>add({id:'th'+g,fam:'th'+g,g,d:2,c:'Theorie & Geist',q:`Welches Theorie-Thema kommt zur Prüfung zum ${GR[g].n} neu hinzu?`,a:t,w:shuffle(THEO.filter(x=>x[0]!==g)).slice(0,4).map(x=>x[1]),x:`PO § 2, ${GR[g].n}: Theorie = Bisherige Themen + ${t}.`}));
/* Bruchtest je Grad */
const BRG=[[5,'1 Technik nach eigener Wahl'],[6,'2 verschiedene Einzeltechniken nach eigener Wahl'],[9,'3 verschiedene Techniken, darunter eine 2er-Kombination'],[10,'4 verschiedene Techniken; 2er-Kombination und eine Sprungtechnik'],[11,'5 verschiedene Techniken; 3er-Kombination und 2 verschiedene Sprungtechniken']];

const strip=s=>String(s).toLowerCase().replace(/ß/g,'ss').normalize('NFD').replace(/[̀-ͯ]/g,'');
const fold=s=>strip(s).replace(/[^a-z]/g,'').replace(/ch/g,'j').replace(/sh/g,'s').replace(/eo/g,'o').replace(/eu/g,'u').replace(/oo/g,'u').replace(/ae/g,'e').replace(/ee/g,'i').replace(/yo/g,'o').replace(/ye/g,'e').replace(/g/g,'k').replace(/d/g,'t').replace(/b/g,'p').replace(/h/g,'').replace(/(.)\1+/g,'$1');
function lev(a,b){const m=a.length,n=b.length;if(!m)return n;if(!n)return m;let p=Array.from({length:n+1},(_,i)=>i);for(let i=1;i<=m;i++){const c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c}return p[n]}
const tol=l=>l<=4?0:l<=8?1:2;
function grade(q,raw,choice){
  if(q.mode==='mc')return choice===q.correctIdx?{s:1}:{s:0};
  const t=strip(raw).trim();
  if(!t)return {s:0};
  if(q.fz){
    const inp=fold(raw);
    const targets=q.fz.map(fold).filter(Boolean);
    let dT=Math.min(...targets.map(x=>lev(inp,x)));
    const inc=targets.some(x=>x.length>=5&&inp.includes(x));
    if(inc)dT=0;
    const tl=Math.max(...targets.map(x=>x.length));
    const others=(q.vs||[]).map(fold).filter(Boolean);
    const dO=others.length?Math.min(...others.map(x=>lev(inp,x))):99;
    const okOther=!others.some(x=>x.length>=5&&x.length>tl&&inp.includes(x));
    const tl2=tol(Math.min(...targets.map(x=>x.length)));
    return (dT<=tl2&&dT<dO&&okOther)?{s:1}:{s:0};
  }
  if(q.kw){
    const hits=q.kw.filter(g=>g.some(r=>r.test(t))).length;
    return {s:Math.min(1,hits/(q.need||q.kw.length)),hits,need:q.need||q.kw.length};
  }
  if(q.re)return {s:q.re.some(r=>r.test(t))?1:0};
  return {s:0};
}

const normTxt=s=>strip(s).replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim();
function gradeAny(q,raw,choice){
  if(q.mode==='card')return {s:choice===1?1:0};
  if(q.custom&&q.mode==='text'){
    const x=normTxt(raw);if(!x)return {s:0};
    const ok=q.accept.some(a=>{const n=normTxt(a);if(!n)return false;if(x===n)return true;const tl=n.length<=4?0:n.length<=8?1:2;if(lev(x,n)<=tl)return true;return n.length>=6&&x.indexOf(n)>=0});
    return {s:ok?1:0};
  }
  return grade(q,raw,choice);
}
function prep(q,diff){
  const o=Object.assign({},q);
  if(q.custom){o.mode=q.kind==='card'?'card':q.kind==='text'?'text':'mc'}
  else{const canText=!!(q.re||q.fz||q.kw);o.mode='mc';if(canText){if(diff===2)o.mode='text';else if(diff===1&&q.d>=2&&Math.random()<.5)o.mode='text'}}
  if(o.mode==='mc'){const n=diff===2?5:4;const opts=shuffle([q.a].concat(shuffle(q.w).slice(0,n-1)));o.opts=opts;o.correctIdx=opts.indexOf(q.a)}
  return o;
}
function weighted(pool,count,wf,cap){
  const cand=pool.map(q=>({q:q,w:Math.max(.01,wf(q))}));
  const out=[],fams=new Set(),cats={},skipped=[];let tries=0;
  while(out.length<count&&cand.length&&tries++<4000){
    const tot=cand.reduce((a,c)=>a+c.w,0);let r=Math.random()*tot,k=0;
    for(;k<cand.length;k++){r-=cand[k].w;if(r<=0)break}
    k=Math.min(k,cand.length-1);
    const q=cand.splice(k,1)[0].q;
    if(fams.has(q.fam))continue;
    if(cap&&(cats[q.c]||0)>=Math.ceil(count*cap)){skipped.push(q);continue}
    fams.add(q.fam);cats[q.c]=(cats[q.c]||0)+1;out.push(q);
  }
  for(let i=0;i<skipped.length&&out.length<count;i++){if(!fams.has(skipped[i].fam)){fams.add(skipped[i].fam);out.push(skipped[i])}}
  return out;
}
const PR=id=>P().progress[id];
const dueList=()=>{const n=today(),p=P();return ALL.filter(q=>p.progress[q.id]&&p.progress[q.id].due<=n).sort((a,b)=>p.progress[a.id].due<p.progress[b.id].due?-1:1)};
const weakList=()=>{const p=P();return ALL.filter(q=>{const r=p.progress[q.id];return r&&r.wrong>0&&(r.box<=2||r.wrong>r.right)}).sort((a,b)=>{const ra=p.progress[a.id],rb=p.progress[b.id];return (rb.wrong/(rb.right+rb.wrong)+(rb.box<=1?.3:0))-(ra.wrong/(ra.right+ra.wrong)+(ra.box<=1?.3:0))})};
function select(mode,cfg){
  const g=cfg.grade,W=[[1,.4,.05],[.3,1,.5],[.05,.5,1]][cfg.diff];
  const pool=ALL.filter(q=>q.g<=g);
  const srs=q=>{const r=PR(q.id);return !r?1.5:(r.box<=2?1.3:.7)};
  const gw=q=>q.g===g?2.4:q.g===g-1?1.5:q.g>=g-3?1.1:.7;
  if(mode==='exam')return weighted(pool,cfg.count,q=>W[q.d-1]*gw(q),.45);
  if(mode==='train')return weighted(pool,cfg.count,q=>W[q.d-1]*gw(q)*srs(q),.45);
  if(mode==='topic')return weighted(pool.filter(q=>q.c===cfg.cat),cfg.count,q=>W[q.d-1]*srs(q),0);
  if(mode==='review')return shuffle(dueList().slice(0,cfg.count));
  if(mode==='weak')return shuffle(weakList().slice(0,cfg.count));
  if(mode==='quick'){const due=dueList().slice(0,5);const fams=new Set(due.map(q=>q.fam));const rest=weighted(pool.filter(q=>!fams.has(q.fam)),5-due.length,q=>gw(q)*srs(q),.6);return shuffle(due.concat(rest))}
  return [];
}

const verdict=s=>s>=1?{k:'lab.good',cls:'good'}:s>=.6?{k:'lab.passed',cls:'good'}:s>=.3?{k:'lab.flawed',cls:'mid'}:{k:'lab.failed',cls:'bad'};
function submit(skip,known){
  if(Q.answered)return;
  const q=Q.qs[Q.i];
  const raw=q.mode==='text'?$('#ans').value:'';
  if(q.mode==='mc'&&Q.sel<0&&!skip)return;
  Q.answered=true;
  const r=skip?{s:0}:q.mode==='card'?gradeAny(q,'',known?1:0):gradeAny(q,raw,Q.sel);
  const v=verdict(r.s),ok=r.s>=1;
  const rec={q,s:r.s,mine:skip?'—':q.mode==='mc'?q.opts[Q.sel]:q.mode==='card'?(known?t('q.knew'):t('q.knewNot')):raw.trim()};
  Q.res[Q.i]=rec;
  if(q.mode==='mc')app.querySelectorAll('.opt').forEach((b,i)=>{b.disabled=true;if(i===q.correctIdx)b.classList.add('ok');else if(i===Q.sel)b.classList.add('no')});
  else if(q.mode==='text')$('#ans').disabled=true;
  const last=Q.i===Q.qs.length-1;
  const partial=r.hits!=null&&r.s>0&&r.s<1?`<p>${esc(t('q.pts',{h:r.hits,n:r.need}))}</p>`:'';
  const comment=ok?t('q.fbOk'):r.s>=.6?t('q.fbMostly'):r.s>0?t('q.fbPart'):t('q.fbNo');
  const canOvr=q.mode==='text'&&!ok&&!skip;
  if(q.mode==='card'){$('#reveal').innerHTML=`<div class="fb ${v.cls}" style="margin-bottom:0"><span class="ans">${esc(q.a)}</span></div>`}
  $('#acts').hidden=true;
  $('#fb').innerHTML=`<div class="fb ${v.cls}"><div class="row sp"><span class="chip">${esc(t(v.k))}</span><span class="label">${esc(t('q.rating',{v:r.s>=.6?t('yes'):t('no')}))}</span></div>
    <p>${esc(comment)}</p>${partial}
    ${!ok&&q.mode!=='card'?`<p class="ans">${esc(t('q.correct',{a:q.a}))}</p>`:''}
    ${q.x?`<p>${esc(q.x)}</p>`:''}
    <div class="row sp">${canOvr?`<button type="button" class="btn ghost sm" data-a="override">${esc(t('q.override'))}</button>`:'<span></span>'}<button type="button" class="btn" id="nextBtn" data-a="next">${esc(last?t('q.result'):t('q.next'))}</button></div></div>`;
  const nb=$('#nextBtn');if(nb)nb.focus({preventScroll:true});

}
function override(){const rec=Q.res[Q.i];if(!rec)return;rec.s=1;rec.self=true;const f=document.querySelector('.fb');f.className='fb good';f.querySelector('.chip').textContent=t('lab.good');f.querySelector('.label').textContent=t('q.rating',{v:t('yes')});const b=document.querySelector('[data-a="override"]');if(b){b.textContent=t('q.overridden');b.disabled=true}}
/* SRS und XP */
const INT=[0,1,3,7,14,30];
function commit(rec){
  if(rec.done)return;rec.done=true;
  const p=P(),q=rec.q,right=rec.s>=.6;
  const r=p.progress[q.id]||(p.progress[q.id]={box:0,due:today(),seen:0,right:0,wrong:0,last:today()});
  r.seen++;if(right){r.right++;r.box=Math.min(5,r.box+1)}else{r.wrong++;r.box=1}r.due=addDays(today(),INT[r.box]);r.last=today();
  const gain=Math.round(({1:10,2:15,3:20}[q.d]||10)*(rec.s>=1?1:rec.s>=.6?.6:0));
  Q.xp+=gain;p.xp+=gain;
  const t0=today(),before=p.daily[t0]||0;p.daily[t0]=before+1;
  if(before<p.goal&&before+1>=p.goal){bumpStreak(p);p.stats.goalDays++;Q.xp+=15;p.xp+=15;Q.goalHit=true}
  wr();
}
function nextQ(){
  const rec=Q.res[Q.i];if(rec)commit(rec);
  if(Q.i<Q.qs.length-1){Q.i++;Q.answered=false;Q.sel=-1;renderQuiz();window.scrollTo(0,0)}else finishQuiz();
}
function quitQuiz(){const any=Q.res.filter(Boolean);any.forEach(commit);ui.screen='main';Q=null;render();window.scrollTo(0,0)}
function finishQuiz(){
  const p=P(),recs=Q.res.filter(Boolean);recs.forEach(commit);
  const n=recs.length;if(!n){quitQuiz();return}
  const pct=Math.round(recs.reduce((a,r)=>a+r.s,0)/n*100);
  const ja=recs.filter(r=>r.s>=.6).length,pass=ja>n/2;
  const flags=[];
  if(n>=5&&recs.every(r=>r.s>=1)){p.xp+=20;Q.xp+=20;p.stats.perfect++;flags.push('r.perfect')}
  if(Q.mode==='exam'&&pass){p.xp+=10;Q.xp+=10;p.stats.examPass++;flags.push('r.passBonus')}
  if(Q.goalHit)flags.push('r.goalBonus');
  p.stats.rounds++;p.rounds.unshift({ts:Date.now(),mode:Q.mode,grade:Q.cfg.grade,n,pct,xp:Q.xp});p.rounds=p.rounds.slice(0,30);
  const nb=checkBadges(p);wr();
  const cats={};recs.forEach(r=>{const c=r.q.c;(cats[c]=cats[c]||{s:0,n:0});cats[c].s+=r.s;cats[c].n++});
  Q.sum={n,pct,ja,pass,flags,newBadges:nb,newLevel:levelOf(p.xp)>Q.lv?levelOf(p.xp):null,cats,wrong:recs.filter(r=>r.s<1)};
  ui.screen='result';render();window.scrollTo(0,0);
}
