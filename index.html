<style>

/* Layout: eine schmale Spalte mit fester Tab-Leiste unten (Daumenzone). Farben aus dem Taegeuk: Blau als Akzent, Rot nur für Fehler.

:root{
  --bg:#eef1f7; --surface:#ffffff; --ink:#13203d; --muted:#586484; --line:#d6dcea;
  --accent:#1b3f94; --accent-ink:#ffffff; --accent-bg:#e4eafa;
  --good:#1c7a4b; --good-bg:#e1f3e9; --bad:#b3261e; --bad-bg:#fbe7e5; --warn:#8a5300; --warn-bg:#fdf0d8;
  --font-display:ui-serif,'Iowan Old Style','Palatino Linotype',Georgia,'Noto Serif','Apple SD Gothic Neo','Malgun Gothic',serif;
  --font-body:system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',sans-serif;
  --r:12px; --nav:62px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d1324; --surface:#151c33; --ink:#e7ebf7; --muted:#9ba6c6; --line:#2a3454;
  --accent:#92b1ff; --accent-ink:#0d1324; --accent-bg:#1c2850;
  --good:#63d393; --good-bg:#12301f; --bad:#ff8b82; --bad-bg:#3a1714; --warn:#f0b957; --warn-bg:#342610; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1324; --surface:#151c33; --ink:#e7ebf7; --muted:#9ba6c6; --line:#2a3454;
  --accent:#92b1ff; --accent-ink:#0d1324; --accent-bg:#1c2850;
  --good:#63d393; --good-bg:#12301f; --bad:#ff8b82; --bad-bg:#3a1714; --warn:#f0b957; --warn-bg:#342610; color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{min-height:100%}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 var(--font-body);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px calc(var(--nav) + 28px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:600px;margin-inline:auto;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--font-display);margin:0;line-height:1.25;text-wrap:balance}
h1{font-size:1.4rem;font-weight:800}h2{font-size:1.15rem;font-weight:700}h3{font-size:1rem;font-weight:700}
p{margin:0}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}

.muted{color:var(--muted);font-size:.9rem}
.btn{border:0;background:var(--accent);color:var(--accent-ink);padding:12px 20px;border-radius:10px;font-weight:600;min-height:44px}

.q{font-family:var(--font-display);font-size:1.25rem;font-weight:600;line-height:1.4;text-wrap:pretty}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;padding:12px 14px;border:1px solid var(--line);background:var(--surface);border-radius:9px;min-width:0}

.opt[aria-checked="true"]{border-color:var(--accent);background:var(--accent-bg)}
.opt[aria-checked="true"] .k{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.opt.ok{border-color:var(--good);background:var(--good-bg)}.opt.no{border-color:var(--bad);background:var(--bad-bg)}

.fb{border-radius:9px;padding:13px 15px;display:flex;flex-direction:column;gap:8px;border:1px solid}

.fb.good .chip{color:var(--good)}.fb.mid .chip{color:var(--warn)}.fb.bad .chip{color:var(--bad)}

.cat{display:grid;grid-template-columns:minmax(0,9rem) 1fr 3rem;gap:10px;align-items:center;font-size:.88rem}

.qitem .a{font-size:.9rem;color:var(--muted);overflow-wrap:anywhere}

.banner{background:var(--warn-bg);border:1px solid var(--warn);border-radius:9px;padding:10px 12px;font-size:.88rem}

.sw-toggle::after{content:'';position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .15s}
.sw-toggle[aria-checked="true"]{background:var(--accent);border-color:var(--accent)}

/* Ergänzungen */

.who{display:flex;align-items:center;gap:12px;min-width:0}

.stat{display:inline-flex;align-items:center;gap:5px;font-weight:700;font-variant-numeric:tabular-nums}
.stat svg{width:18px;height:18px}
.stat.flame{color:var(--flame)}.stat.xp{color:var(--accent)}
.beltbar.big{height:30px}
.beltbar b{position:absolute;inset:-4px auto -4px 50%;width:20px;margin-left:-10px;background:rgba(0,0,0,.2);border-radius:3px}
.tile{cursor:pointer}
.tile.main b{font-size:1.1rem}
.tile .n{font-variant-numeric:tabular-nums}
.mcard{padding:0;overflow:hidden}
.mhead{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;background:none;padding:14px 16px}
.mhead b{display:block}
.mhead .chev{font-size:1.4rem;color:var(--muted);transition:transform .15s}
.mhead[aria-expanded="true"] .chev{transform:rotate(90deg)}
.mbody{padding:0 16px 16px;display:flex;flex-direction:column;gap:12px}
.fld{display:flex;flex-direction:column;gap:6px}
.pill{display:inline-block;font-size:.74rem;font-weight:700;padding:1px 8px;border-radius:99px;background:var(--accent-bg);color:var(--accent);font-variant-numeric:tabular-nums}
.act{display:flex;gap:4px;align-items:flex-end;height:84px}
.act .d{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:3px;font-size:.62rem;color:var(--muted);height:100%}

.act i.g{background:var(--good)}
.errs{display:flex;flex-direction:column;gap:4px;color:var(--bad);font-size:.9rem}

.sel{appearance:auto}
.xpline{display:flex;flex-wrap:wrap;gap:6px}

:root{padding-top:env(safe-area-inset-top,0px)}

<script>
/* ===================== AUSWERTUNG ===================== */
const strip=s=>String(s).toLowerCase().replace(/ß/g,'ss').normalize('NFD').replace(/[̀-ͯ]/g,'');
const fold=s=>strip(s).replace(/[^a-z]/g,'').replace(/ch/g,'j').replace(/sh/g,'s').replace(/eo/g,'o').replace(/eu/g,'u').replace(/oo/g,'u').replace(/ae/g,'e').replace(/ee/g,'i').replace(/yo/g,'o').replace(/ye/g,'e').replace(/g/g,'k').replace(/d/g,'t').replace(/b/g,'p').replace(/h/g,'').replace(/(.)\1+/g,'$1');
function lev(a,b){const m=a.length,n=b.length;if(!m)return n;if(!n)return m;let p=Array.from({length:n+1},(_,i)=>i);for(let i=1;i<=m;i++){const c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c}return p[n]}
const tol=l=>l<=4?0:l<=8?1:2;
function grade(q,raw,choice){
  if(q.mode==='mc')return choice===q.correctIdx?{s:1}:{s:0};
  const t=strip(raw).trim();
  if(!t)return {s:0};
  if(q.fz){
    const inp=fold(raw);
    const targets=q.fz.map(fold).filter(Boolean);
    let dT=Math.min(...targets.map(x=>lev(inp,x)));
    const inc=targets.some(x=>x.length>=5&&inp.includes(x));
    if(inc)dT=0;
    const tl=Math.max(...targets.map(x=>x.length));
    const others=(q.vs||[]).map(fold).filter(Boolean);
    const dO=others.length?Math.min(...others.map(x=>lev(inp,x))):99;
    const okOther=!others.some(x=>x.length>=5&&x.length>tl&&inp.includes(x));
    const tl2=tol(Math.min(...targets.map(x=>x.length)));
    return (dT<=tl2&&dT<dO&&okOther)?{s:1}:{s:0};
  }
  if(q.kw){
    const hits=q.kw.filter(g=>g.some(r=>r.test(t))).length;
    return {s:Math.min(1,hits/(q.need||q.kw.length)),hits,need:q.need||q.kw.length};
  }
  if(q.re)return {s:q.re.some(r=>r.test(t))?1:0};
  return {s:0};
}
const label=(s,mc)=>s>=1?['Sehr gut','good','Ja']:s>=.6?['Bestanden','good','Ja']:s>=.3?['Fehlerhaft','mid','Nein']:['Nicht bestanden','bad','Nein'];
const note=p=>p>=92?1:p>=81?2:p>=67?3:p>=50?4:p>=30?5:6;
const noteTxt=n=>['','sehr gut','gut','befriedigend','ausreichend','mangelhaft','ungenügend'][n];


/* ===================== APP (UI, Profile, Lernmodi) ===================== */
(function(){
'use strict';
if(typeof POOL==='undefined'){document.getElementById('app').innerHTML='<div class="card"><b>fragen.js</b> fehlt / missing</div>';return}
const app=document.getElementById('app');
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---------- Texte DE / EN ---------- */
const I18N={
'app.name':['TKD Trainer','TKD Trainer'],
'nav.home':['Start','Home'],'nav.learn':['Lernen','Learn'],'nav.cat':['Fragen','Questions'],'nav.me':['Profil','Profile'],
'yes':['Ja','Yes'],'no':['Nein','No'],'cancel':['Abbrechen','Cancel'],'save':['Speichern','Save'],'delete':['Löschen','Delete'],'edit':['Bearbeiten','Edit'],'back':['Zurück','Back'],
'ob.title':['Willkommen im Dojang','Welcome to the dojang'],
'ob.intro':['Lege dein Profil an. Alles bleibt auf diesem Gerät, es gibt kein Konto und keinen Server.','Create your profile. Everything stays on this device. There is no account and no server.'],
'ob.name':['Name','Name'],'ob.avatar':['Bild oder Farbe','Photo or colour'],'av.up':['Foto','Photo'],'av.rm':['Foto entfernen','Remove photo'],'av.bad':['Bild konnte nicht gelesen werden','Could not read image'],'ob.target':['Zielprüfung','Target exam'],'ob.goal':['Tagesziel (Fragen pro Tag)','Daily goal (questions per day)'],
'ob.start':['Los geht es','Let us go'],'ob.restore':['Sicherung wiederherstellen','Restore a backup'],'ob.nameDefault':['Prüfling','Candidate'],'ob.lang':['Sprache','Language'],

const CAT_EN={'Prüfungsordnung':'Exam regulations','Zweikampf & Technik':'Sparring & technique','Poomsae':'Poomsae (forms)','Bruchtest':'Breaking test','Selbstverteidigung':'Self-defence','Theorie & Geist':'Theory & spirit','Verband & Struktur':'Federation & structure','Begriffe & Kommandos':'Terms & commands'};

const KEY='tkd-trainer-v1';
let memStore=null;
function rd(){try{const r=localStorage.getItem(KEY);if(r)return JSON.parse(r)}catch(e){}try{return memStore?JSON.parse(memStore):null}catch(e){return null}}
let DB=rd()||{v:1,lang:(navigator.language||'de').toLowerCase().indexOf('de')===0?'de':'en',theme:'auto',profiles:[],active:null,custom:[],packsOff:{},nextId:1};

function fixP(p){p.progress=p.progress||{};p.daily=p.daily||{};p.streak=Object.assign({count:0,best:0,last:'',freezeWeek:''},p.streak);p.rounds=p.rounds||[];p.badges=p.badges||{};
  p.stats=Object.assign({rounds:0,perfect:0,examPass:0,goalDays:0,own:0},p.stats);p.xp=p.xp||0;p.goal=p.goal||10;p.examDate=p.examDate||'';p.target=p.target||0;p.color=p.color||0;if(!(typeof p.img==='string'&&/^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+\/=]+$/.test(p.img)&&p.img.length<400000))p.img='';
  p.cfg=Object.assign({grade:p.target,diff:1,count:10,cat:'Poomsae'},p.cfg)}
function fixDB(){DB.v=1;DB.custom=DB.custom||[];DB.packsOff=DB.packsOff||{};DB.nextId=DB.nextId||1;DB.profiles=DB.profiles||[];DB.theme=DB.theme||'auto';DB.lang=DB.lang==='en'?'en':'de';
  DB.profiles.forEach(fixP);if(!DB.profiles.some(p=>p.id===DB.active))DB.active=DB.profiles[0]?DB.profiles[0].id:null}
fixDB();lang=DB.lang;
const P=()=>DB.profiles.find(p=>p.id===DB.active);
const COLORS=['#1b3f94','#b3261e','#1c7a4b','#8a5300','#6b3fa0','#0f766e','#b4236b','#374151'];

/* ---------- Datum ---------- */
const pad=n=>String(n).padStart(2,'0');
const ds=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>ds(new Date());
const addDays=(s,n)=>{const a=s.split('-').map(Number);return ds(new Date(a[0],a[1]-1,a[2]+n))};
const diffDays=(a,b)=>{const x=a.split('-').map(Number),y=b.split('-').map(Number);return Math.round((Date.UTC(y[0],y[1]-1,y[2])-Date.UTC(x[0],x[1]-1,x[2]))/864e5)};
const weekId=s=>{const a=s.split('-').map(Number);const dt=new Date(Date.UTC(a[0],a[1]-1,a[2]));const dn=dt.getUTCDay()||7;dt.setUTCDate(dt.getUTCDate()+4-dn);const y0=new Date(Date.UTC(dt.getUTCFullYear(),0,1));return dt.getUTCFullYear()+'-'+Math.ceil(((dt-y0)/864e5+1)/7)};
const fmtDate=s=>{const a=s.split('-').map(Number);return new Date(a[0],a[1]-1,a[2]).toLocaleDateString(locale(),{day:'numeric',month:'short',year:'numeric'})};

/* ---------- Fragenpool inkl. eigener Fragen ---------- */
let ALL=[],BYID={};
function customToQ(c){return {id:c.id,fam:c.id,g:c.g,d:c.d,c:c.c,q:c.q,a:c.a,w:c.w||[],x:c.x||'',custom:true,kind:c.kind,accept:[c.a].concat(c.alts||[]),pack:c.pack}}
function rebuild(){ALL=POOL.slice();DB.custom.forEach(c=>{if(!DB.packsOff[c.pack])ALL.push(customToQ(c))});BYID={};ALL.forEach(q=>{BYID[q.id]=q})}
rebuild();
const normTxt=s=>strip(s).replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim();
function gradeAny(q,raw,choice){
  if(q.mode==='card')return {s:choice===1?1:0};
  if(q.custom&&q.mode==='text'){
    const x=normTxt(raw);if(!x)return {s:0};
    const ok=q.accept.some(a=>{const n=normTxt(a);if(!n)return false;if(x===n)return true;const tl=n.length<=4?0:n.length<=8?1:2;if(lev(x,n)<=tl)return true;return n.length>=6&&x.indexOf(n)>=0});
    return {s:ok?1:0};
  }
  return grade(q,raw,choice);
}
function prep(q,diff){
  const o=Object.assign({},q);
  if(q.custom){o.mode=q.kind==='card'?'card':q.kind==='text'?'text':'mc'}
  else{const canText=!!(q.re||q.fz||q.kw);o.mode='mc';if(canText){if(diff===2)o.mode='text';else if(diff===1&&q.d>=2&&Math.random()<.5)o.mode='text'}}
  if(o.mode==='mc'){const n=diff===2?5:4;const opts=shuffle([q.a].concat(shuffle(q.w).slice(0,n-1)));o.opts=opts;o.correctIdx=opts.indexOf(q.a)}
  return o;
}
function weighted(pool,count,wf,cap){
  const cand=pool.map(q=>({q:q,w:Math.max(.01,wf(q))}));
  const out=[],fams=new Set(),cats={},skipped=[];let tries=0;
  while(out.length<count&&cand.length&&tries++<4000){
    const tot=cand.reduce((a,c)=>a+c.w,0);let r=Math.random()*tot,k=0;
    for(;k<cand.length;k++){r-=cand[k].w;if(r<=0)break}
    k=Math.min(k,cand.length-1);
    const q=cand.splice(k,1)[0].q;
    if(fams.has(q.fam))continue;
    if(cap&&(cats[q.c]||0)>=Math.ceil(count*cap)){skipped.push(q);continue}
    fams.add(q.fam);cats[q.c]=(cats[q.c]||0)+1;out.push(q);
  }
  for(let i=0;i<skipped.length&&out.length<count;i++){if(!fams.has(skipped[i].fam)){fams.add(skipped[i].fam);out.push(skipped[i])}}
  return out;
}
const PR=id=>P().progress[id];
const dueList=()=>{const n=today(),p=P();return ALL.filter(q=>p.progress[q.id]&&p.progress[q.id].due<=n).sort((a,b)=>p.progress[a.id].due<p.progress[b.id].due?-1:1)};
const weakList=()=>{const p=P();return ALL.filter(q=>{const r=p.progress[q.id];return r&&r.wrong>0&&(r.box<=2||r.wrong>r.right)}).sort((a,b)=>{const ra=p.progress[a.id],rb=p.progress[b.id];return (rb.wrong/(rb.right+rb.wrong)+(rb.box<=1?.3:0))-(ra.wrong/(ra.right+ra.wrong)+(ra.box<=1?.3:0))})};
function select(mode,cfg){
  const g=cfg.grade,W=[[1,.4,.05],[.3,1,.5],[.05,.5,1]][cfg.diff];
  const pool=ALL.filter(q=>q.g<=g);
  const srs=q=>{const r=PR(q.id);return !r?1.5:(r.box<=2?1.3:.7)};
  const gw=q=>q.g===g?2.4:q.g===g-1?1.5:q.g>=g-3?1.1:.7;
  if(mode==='exam')return weighted(pool,cfg.count,q=>W[q.d-1]*gw(q),.45);
  if(mode==='train')return weighted(pool,cfg.count,q=>W[q.d-1]*gw(q)*srs(q),.45);
  if(mode==='topic')return weighted(pool.filter(q=>q.c===cfg.cat),cfg.count,q=>W[q.d-1]*srs(q),0);
  if(mode==='review')return shuffle(dueList().slice(0,cfg.count));
  if(mode==='weak')return shuffle(weakList().slice(0,cfg.count));
  if(mode==='quick'){const due=dueList().slice(0,5);const fams=new Set(due.map(q=>q.fam));const rest=weighted(pool.filter(q=>!fams.has(q.fam)),5-due.length,q=>gw(q)*srs(q),.6);return shuffle(due.concat(rest))}
  return [];
}

function bumpStreak(p){const s=p.streak,t0=today();if(s.last===t0)return;const d=s.last?diffDays(s.last,t0):99;

const INT=[0,1,3,7,14,30];
function commit(rec){
  if(rec.done)return;rec.done=true;
  const p=P(),q=rec.q,right=rec.s>=.6;
  const r=p.progress[q.id]||(p.progress[q.id]={box:0,due:today(),seen:0,right:0,wrong:0,last:today()});
  r.seen++;if(right){r.right++;r.box=Math.min(5,r.box+1)}else{r.wrong++;r.box=1}r.due=addDays(today(),INT[r.box]);r.last=today();
  const gain=Math.round(({1:10,2:15,3:20}[q.d]||10)*(rec.s>=1?1:rec.s>=.6?.6:0));
  Q.xp+=gain;p.xp+=gain;
  const t0=today(),before=p.daily[t0]||0;p.daily[t0]=before+1;
  if(before<p.goal&&before+1>=p.goal){bumpStreak(p);p.stats.goalDays++;Q.xp+=15;p.xp+=15;Q.goalHit=true}
  wr();
}

function parseCSV(text,delim){const rows=[];let row=[],cur='',inQ=false;
  for(let i=0;i<text.length;i++){const ch=text[i];
    if(inQ){if(ch==='"'){if(text[i+1]==='"'){cur+='"';i++}else inQ=false}else cur+=ch}
    else if(ch==='"'&&cur===''){inQ=true}
    else if(ch===delim){row.push(cur);cur=''}
    else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&text[i+1]==='\n')i++;row.push(cur);cur='';if(row.some(x=>x.trim()!==''))rows.push(row);row=[]}
    else cur+=ch}
  row.push(cur);if(row.some(x=>x.trim()!==''))rows.push(row);return rows}
function parseGrade(v){
  const s=strip(String(v==null?'':v)).trim();if(!s)return null;
  const nums=s.match(/^(\d+)/);
  if(typeof v==='number'||/^\d+$/.test(s)){const n=+s;for(let i=0;i<=8;i++)if(GR[i].n.indexOf(n+'. Kup')===0)return i;return undefined}
  const m=s.match(/(\d+)\D*(kup|poom|dan)/);
  if(m){const n=+m[1],k=m[2];for(let i=0;i<GR.length;i++){const g=GR[i].n;if(k==='kup'&&g===n+'. Kup')return i;if(k==='poom'&&g===n+'. Poom/Dan')return i;if(k==='dan'&&(g===n+'. Dan'||g===n+'. Poom/Dan'))return i}}

}

    const head=raw[0].map(h=>SYNMAP[strip(h).replace(/[^a-z0-9 ]/g,'')]||null);
    let cols,data;
    if(head.indexOf('q')>=0&&head.indexOf('a')>=0){cols=head;data=raw.slice(1)}
    else if(head.filter(Boolean).length===0&&raw[0].length>=2){cols=DEFCOLS;data=raw}
    else{res.fatal=t('i.e.cols');return res}
    rows=data.map(r=>{const o={};cols.forEach((k,i)=>{if(k&&r[i]!=null&&r[i].trim()!=='')o[k]=r[i].trim()});return o});
  }
  const seen=new Set(browseList().map(q=>normTxt(q.q)));
  rows.forEach((r,i)=>{
    const rn=i+2,q=String(r.q==null?'':r.q).trim(),a=String(r.a==null?'':r.a).trim();
    if(!q){res.errors.push(t('i.row',{r:rn,m:t('i.e.q')}));return}
    if(!a){res.errors.push(t('i.row',{r:rn,m:t('i.e.a')}));return}
    let w=splitList(r.w);['w1','w2','w3'].forEach(k=>{if(r[k]!=null&&String(r[k]).trim())w.push(String(r[k]).trim())});
    w=w.filter(x=>normTxt(x)!==normTxt(a));
    const kind=parseKind(r.kind,w.length>0);
    if(kind==='mc'&&!w.length){res.errors.push(t('i.row',{r:rn,m:t('i.e.w')}));return}
    let g=parseGrade(r.g);if(g===undefined){res.errors.push(t('i.row',{r:rn,m:t('i.e.g',{v:r.g})}));return}if(g===null)g=P().target;
    const nq=normTxt(q);if(seen.has(nq)){res.dups++;return}seen.add(nq);
    res.ok.push({kind,q,a,w:kind==='mc'?w.slice(0,5):[],alts:kind==='text'?splitList(r.alts):[],x:String(r.x==null?'':r.x).trim(),c:String(r.c==null?'':r.c).trim()||t('f.defCat'),g,d:parseDiff(r.d),pack:String(r.pack==null?'':r.pack).trim()||pack});
  });
  return res;
}

  if(d.s){const f=ui.cat;if(d.s==='q'){f.q=el.value;f.limit=40;$('#catres').innerHTML=catResults()}}
});
document.addEventListener('change',e=>{
  const el=e.target,d=el.dataset;
  if(d.o==='avfile'){const f=el.files&&el.files[0];el.value='';if(!f)return;resizeImg(f,url=>{if(d.w==='ob'&&ui.ob)ui.ob.img=url;else{P().img=url;wr()}render()});return}
  if(d.o==='target'&&ui.ob){ui.ob.target=+el.value;return}
  if(d.s==='cat'){ui.cat.cat=el.value;ui.cat.limit=40;$('#catres').innerHTML=catResults();return}
  if(d.s==='own'){ui.cat.own=el.checked;ui.cat.limit=40;$('#catres').innerHTML=catResults();return}
  if(d.f&&ui.form){ui.form[d.f]=el.value;return}
  if(d.c==='cfg'){const p=P();p.cfg[d.k]=d.k==='cat'?el.value:+el.value;wr();return}
  if(d.c==='name'){const p=P();p.name=el.value.trim()||p.name;wr();return}
  if(d.c==='target'){const p=P();p.target=+el.value;p.cfg.grade=p.target;wr();return}
  if(d.c==='exam'){P().examDate=el.value;wr();return}
  if(d.c==='file'&&el.files&&el.files[0]){const f=el.files[0];readFile(f,txt=>{ui.imp.text=txt;ui.imp.name=f.name.replace(/\.[^.]+$/,'');ui.imp.pack=ui.imp.name;ui.imp.res=parseImport(txt,ui.imp.name);render()});return}
  if(d.c==='bkfile'&&el.files&&el.files[0]){readFile(el.files[0],txt=>{ui.bkText=txt;ui.bkShow=true;render()});return}
});
document.addEventListener('keydown',e=>{
  if(ui.screen!=='quiz'||!Q)return;const q=Q.qs[Q.i];if(!q||e.target.tagName==='TEXTAREA'||e.target.tagName==='INPUT')return;
  if(!Q.answered&&q.mode==='mc'&&/^[1-5]$/.test(e.key)){const b=app.querySelectorAll('.opt')[+e.key-1];if(b)b.click()}
  else if(e.key==='Enter'&&!Q.answered&&q.mode==='mc'&&Q.sel>=0){e.preventDefault();submit(false)}
});

window.__app={DB:()=>DB,ALL:()=>ALL,ui,Q:()=>Q,I18N,t,render,P,dueList,weakList,parseImport,exportText,select,levelOf,BADGES,setLang:l=>{lang=l}};
render();
if('serviceWorker' in navigator&&location.protocol.indexOf('http')===0){window.addEventListener('load',()=>{try{navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}})}
})();

</script>
</body>
